# Temporary read-only canonical-format extraction for final Oasis and Mirage qualification.
name: Oasis qualification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: oasis-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Produce canonical source formatting patch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out validation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned formatter toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git make m4 opam
          opam init --bare --disable-sandboxing --yes
          opam switch create centl ocaml-base-compiler.4.14.1 --jobs=2 --yes
          opam install --switch=centl --yes dune.3.24.1 ocamlformat.0.29.0

      - name: Produce canonical formatting patch
        shell: bash
        run: |
          set -euo pipefail
          opam exec --switch=centl -- make format-fix
          git diff --check
          git diff --binary -- src > format.patch
          git diff --stat -- src
          test -s format.patch || echo "Source formatting is already canonical."

      - name: Preserve formatting patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oasis-format-patch-${{ github.sha }}
          path: format.patch
          if-no-files-found: error
