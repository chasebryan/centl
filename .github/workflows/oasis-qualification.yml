# Temporary canonical-format pass for the final Oasis and Mirage qualification.
name: Oasis qualification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: oasis-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Canonicalize integrated source formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out validation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/final-oasis-mirage-validation
          persist-credentials: true

      - name: Install pinned formatter toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git make m4 opam
          opam init --bare --disable-sandboxing --yes
          opam switch create centl ocaml-base-compiler.4.14.1 --jobs=2 --yes
          opam install --switch=centl --yes dune.3.24.1 ocamlformat.0.29.0

      - name: Apply and commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          opam exec --switch=centl -- make format-fix
          if git diff --quiet --; then
            echo "Source formatting is already canonical."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style: apply canonical OCaml formatting"
          git push origin HEAD:chore/final-oasis-mirage-validation
