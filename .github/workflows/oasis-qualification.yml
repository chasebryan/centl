name: Oasis qualification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oasis-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FSTAR_VERSION: "2026.07.05"
  FSTAR_COMMIT: "2173bc4316a51f01754f10bf94f697aba083c2e0"
  FSTAR_SHA256: "23829d496c909c67f7261c1471be34047ad0d508ee0b933607618b313cbae1a4"
  Z3_VERSION: "4.13.3"

jobs:
  core:
    name: Verify, quality-check, and test integrated source
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git make m4 opam pkg-config python3 \
            libgmp-dev libmpfr-dev libflint-dev

      - name: Install pinned F* toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/fstar.tar.gz"
          root="$RUNNER_TEMP/fstar"
          curl --fail --silent --show-error --location \
            "https://github.com/FStarLang/FStar/releases/download/v${FSTAR_VERSION}/fstar-v${FSTAR_VERSION}-Linux-x86_64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$FSTAR_SHA256" "$archive" | sha256sum --check
          mkdir -p "$root"
          tar -xzf "$archive" -C "$root"
          fstar=$(find "$root" -type f -path '*/bin/fstar.exe' -print -quit)
          test -n "$fstar"
          "$fstar" --version | grep -F "commit=${FSTAR_COMMIT}"
          z3=$("$fstar" --locate_z3 "$Z3_VERSION")
          "$z3" --version | grep -F "Z3 version ${Z3_VERSION}"
          printf '%s\n' "$(dirname "$fstar")" >> "$GITHUB_PATH"

      - name: Install pinned OCaml dependencies
        shell: bash
        run: |
          set -euo pipefail
          opam init --bare --disable-sandboxing --yes
          opam switch create centl ocaml-base-compiler.4.14.1 --jobs=2 --yes
          opam install --switch=centl --deps-only --with-test --assume-depexts --yes .

      - name: Verify F* source
        run: opam exec --switch=centl -- make verify

      - name: Run repository quality gates
        run: opam exec --switch=centl -- make quality

      - name: Run integrated native test suite
        run: opam exec --switch=centl -- make native-test

      - name: Check patch whitespace
        run: git diff --check
