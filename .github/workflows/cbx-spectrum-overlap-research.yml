name: CBX spectrum overlap research

on:
  workflow_dispatch:
    inputs:
      hi:
        description: 'Inclusive p upper bound'
        required: true
        default: '10000000'
      i_max:
        description: 'Largest standalone Lane-I shift'
        required: true
        default: '400'
      segment:
        description: 'p segment size'
        required: true
        default: '1000000'
  pull_request:
    paths:
      - '.github/workflows/cbx-spectrum-overlap-research.yml'

permissions:
  contents: read

jobs:
  fedora-spectrum-research:
    name: Fedora deep spectrum overlap
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    env:
      HI: ${{ inputs.hi || '10000000' }}
      I_MAX: ${{ inputs.i_max || '400' }}
      SEGMENT: ${{ inputs.segment || '1000000' }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CHECKOUT_SHA: ${{ github.sha }}

    steps:
      - name: Install Fedora research toolchain
        run: dnf -y install gcc make python3 git tar gzip coreutils

      - uses: actions/checkout@v4

      - name: Build standalone profiler
        run: make -C research/erdos-straus/cbx.kernel cbx-standalone-i

      - name: Generate exact hit relations and spectrum overlap
        run: |
          mkdir -p /tmp/cbx-spectrum
          ./centl es cbx standalone-i \
            --hi "$HI" \
            --i-max "$I_MAX" \
            --segment "$SEGMENT" \
            --sets /tmp/cbx-spectrum/standalone-hit-relations.tsv \
            > /tmp/cbx-spectrum/standalone-profile.json
          ./centl es cbx analyze-spectrum-overlap \
            /tmp/cbx-spectrum/standalone-hit-relations.tsv --json \
            > /tmp/cbx-spectrum/spectrum-overlap.json

      - name: Independently recompute spectrum containments from raw relations
        run: |
          python3 - <<'PY'
          from collections import defaultdict
          import json

          root='/tmp/cbx-spectrum'
          expected=json.load(open(root+'/spectrum-overlap.json', encoding='utf-8'))
          residues={'A':{1,121},'B':{169,289},'C':{361,529}}
          sets={s:defaultdict(set) for s in residues}
          ks=set()
          rows=0
          with open(root+'/standalone-hit-relations.tsv', encoding='utf-8') as fh:
              for lineno, raw in enumerate(fh, 1):
                  raw=raw.strip()
                  if not raw:
                      continue
                  k,p=map(int,raw.split('\t'))
                  ks.add(k)
                  spec=None
                  r=p%840
                  for name, rr in residues.items():
                      if r in rr:
                          spec=name
                          break
                  if spec is None:
                      raise SystemExit(f'non-hard relation at line {lineno}: p={p}')
                  if p in sets[spec][k]:
                      raise SystemExit(f'duplicate relation at line {lineno}: k={k} p={p}')
                  sets[spec][k].add(p)
                  rows += 1
          ks=sorted(ks)
          assert rows == expected['relation_rows']

          def masks_for(spec):
              universe=sorted(set().union(*(sets[spec][k] for k in ks)))
              index={p:i for i,p in enumerate(universe)}
              masks={}
              for k in ks:
                  m=0
                  for p in sets[spec][k]:
                      m |= 1 << index[p]
                  masks[k]=m
              return masks

          def exact_counts(spec):
              masks=masks_for(spec)
              one=[]; two=[]; three=[]
              one_targets=set(); two_targets=set()
              for j,k in enumerate(ks):
                  mk=masks[k]
                  if not mk:
                      continue
                  for i in range(j):
                      a=ks[i]
                      if mk & ~masks[a] == 0:
                          one.append((k,a,mk.bit_count()))
                          one_targets.add(k)
                          break
              for j,k in enumerate(ks):
                  mk=masks[k]
                  if not mk or k in one_targets:
                      continue
                  found=None
                  for ai in range(j-1):
                      a=ks[ai]
                      missing=mk & ~masks[a]
                      for bi in range(ai+1,j):
                          b=ks[bi]
                          if missing & ~masks[b] == 0:
                              found=(a,b)
                              break
                      if found:
                          break
                  if found:
                      two.append((k,*found,mk.bit_count()))
                      two_targets.add(k)
              for j,k in enumerate(ks):
                  mk=masks[k]
                  if not mk or k in one_targets or k in two_targets:
                      continue
                  found=None
                  for ai in range(j-2):
                      a=ks[ai]; ma=masks[a]
                      for bi in range(ai+1,j-1):
                          b=ks[bi]
                          missing=mk & ~(ma|masks[b])
                          if not missing:
                              continue
                          for ci in range(bi+1,j):
                              c=ks[ci]
                              if missing & ~masks[c] == 0:
                                  found=(a,b,c)
                                  break
                          if found:
                              break
                      if found:
                          break
                  if found:
                      three.append((k,*found,mk.bit_count()))
              return {'one':one,'two':two,'three':three}

          independent={s:exact_counts(s) for s in ('A','B','C')}
          for spec in ('A','B','C'):
              got=independent[spec]
              exp=expected['spectra'][spec]
              assert len(got['one']) == exp['exact_single_layer_containment_count'], (spec,'one',got['one'],exp['exact_single_layer_containments'])
              assert len(got['two']) == exp['exact_two_layer_containment_target_count'], (spec,'two',got['two'],exp['exact_two_layer_containment_targets'])
              assert len(got['three']) == exp['exact_three_layer_containment_target_count'], (spec,'three',got['three'],exp['exact_three_layer_containment_targets'])

          out={
              'verification':'independent-spectrum-bitset-v1',
              'relation_rows':rows,
              'counts':{
                  s:{'size_1':len(independent[s]['one']),'size_2':len(independent[s]['two']),'size_3':len(independent[s]['three'])}
                  for s in ('A','B','C')
              },
              'witnesses':independent,
          }
          json.dump(out,open(root+'/INDEPENDENT-VERIFICATION.json','w'),indent=2,sort_keys=True)
          print('::notice title=CBX independent deep spectrum verification::' + '; '.join(
              f"{s}:one={len(independent[s]['one'])},two={len(independent[s]['two'])},three={len(independent[s]['three'])}"
              for s in ('A','B','C')
          ))
          PY

      - name: Build concise research summary
        run: |
          python3 - <<'PY'
          import json, os
          root='/tmp/cbx-spectrum'
          raw=json.load(open(root+'/standalone-profile.json'))
          r=json.load(open(root+'/spectrum-overlap.json'))
          v=json.load(open(root+'/INDEPENDENT-VERIFICATION.json'))
          assert raw['kernel'] == 'cbx.kernel'
          assert raw['sets_recorded'] is True
          assert r['analysis'] == 'cbx-lane-I-spectrum-overlap-v1'
          assert r['relation_rows'] == raw['set_relations'] == v['relation_rows']
          assert sum(x['hit_events'] for x in r['spectra'].values()) == r['relation_rows']
          assert r['exact_containment_counts'] == v['counts']
          report={
              'kernel':'cbx.kernel',
              'mode':'spectrum-overlap-census-v2',
              'source_commit':os.environ['SOURCE_SHA'],
              'checkout_commit':os.environ['CHECKOUT_SHA'],
              'hi':int(os.environ['HI']),
              'i_max':int(os.environ['I_MAX']),
              'hard_primes':raw['hard_primes'],
              'layers':r['layers'],
              'relation_rows':r['relation_rows'],
              'exact_containment_counts':r['exact_containment_counts'],
              'independent_verification':v,
              'spectra':{
                  name:{
                      'hard_primes_hit_by_any_layer':s['hard_primes_hit_by_any_layer'],
                      'hit_events':s['hit_events'],
                      'nonempty_layers':s['nonempty_layers'],
                      'zero_hit_layers':s['zero_hit_layers'],
                      'novel_layers':s['novel_layers'],
                      'novel_k':s['novel_k'],
                      'fully_shadowed_by_prior_union_layers':s['fully_shadowed_by_prior_union_layers'],
                      'exact_single_layer_containments':s['exact_single_layer_containments'],
                      'exact_two_layer_containment_targets':s['exact_two_layer_containment_targets'],
                      'exact_three_layer_containment_targets':s['exact_three_layer_containment_targets'],
                      'best_earlier_single_overlap':s['best_earlier_single_overlap'][:20],
                      'above_107':s['above_107'],
                  }
                  for name,s in r['spectra'].items()
              },
              'claim':r['claim'],
          }
          json.dump(report, open(root+'/RESEARCH-SUMMARY.json','w'), indent=2, sort_keys=True)
          c=report['exact_containment_counts']
          print(
              f"::notice title=CBX deep spectrum overlap v2::"
              f"X={report['hi']}; K_I={report['i_max']}; hard={report['hard_primes']}; " + '; '.join(
                  f"{name}:nonempty={report['spectra'][name]['nonempty_layers']},"
                  f"novel={report['spectra'][name]['novel_layers']},"
                  f"one={c[name]['size_1']},two={c[name]['size_2']},three={c[name]['size_3']}"
                  for name in ('A','B','C')
              )
          )
          PY

      - name: Preserve environment and hashes
        run: |
          {
            echo "kernel=cbx.kernel"
            echo "source_commit=$SOURCE_SHA"
            echo "checkout_commit=$CHECKOUT_SHA"
            echo "hi=$HI"
            echo "i_max=$I_MAX"
            echo "segment=$SEGMENT"
            echo "os_release=$(tr '\n' ' ' </etc/os-release)"
            echo "uname=$(uname -a)"
            echo "cc=$(cc --version | head -n1)"
            echo "python=$(python3 --version)"
          } > /tmp/cbx-spectrum/ENVIRONMENT.txt
          cd /tmp/cbx-spectrum
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload spectrum overlap artifact
        uses: actions/upload-artifact@v7
        with:
          name: cbx-spectrum-overlap-fedora-X${{ env.HI }}-K${{ env.I_MAX }}-${{ env.SOURCE_SHA }}
          path: /tmp/cbx-spectrum/
          if-no-files-found: error
          retention-days: 90
