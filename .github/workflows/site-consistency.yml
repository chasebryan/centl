name: Site consistency

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/MATHEMATICIANS.md'
      - 'docs/PHYSICISTS.md'
      - 'scripts/publish-site-library.py'
      - 'scripts/site-consistency.py'
      - '.github/workflows/site-consistency.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/MATHEMATICIANS.md'
      - 'docs/PHYSICISTS.md'
      - 'scripts/publish-site-library.py'
      - 'scripts/site-consistency.py'
      - '.github/workflows/site-consistency.yml'

permissions:
  contents: write

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cbx-kernel
          fetch-depth: 0

      - name: Regenerate canonical site artifacts
        run: |
          set -euo pipefail
          python3 scripts/site-consistency.py --apply
          python3 scripts/publish-site-library.py
          python3 scripts/site-consistency.py --check
          python3 scripts/publish-site-library.py --check

      - name: Commit generated artifacts and restore CI
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/site-consistency.yml
          rm -f .github/workflows/cbx-refresh-site.yml
          git add -A
          git diff --cached --check
          git commit -m "chore(site): refresh generated library for CBX push"
          git push origin HEAD:agent/cbx-kernel
