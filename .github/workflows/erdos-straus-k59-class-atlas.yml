name: Erdős–Straus k=59 class-conditioned atlas

on:
  pull_request:
    paths:
      - 'research/erdos-straus/K59-CLASS-CONDITIONED-HARD-ATLAS.md'
      - 'research/erdos-straus/classify_k59_class_conditioned_states.py'
      - 'research/erdos-straus/verify_k59_class_conditioned_states.py'
      - 'research/erdos-straus/classify_k59_states.py'
      - '.github/workflows/erdos-straus-k59-class-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fedora-k59-class-atlas:
    name: Fedora k=59 class-conditioned atlas
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Install Fedora Python
        run: dnf -y install python3

      - uses: actions/checkout@v4

      - name: Verify exact class-seed closures
        run: |
          python3 research/erdos-straus/classify_k59_class_conditioned_states.py \
            --json > /tmp/k59-class-atlas.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/k59-class-atlas.json', encoding='utf-8'))
          assert r['analysis'] == 'k59-class-conditioned-hard-state-atlas-v1'
          assert r['class_seed'] == {
              '1':15,'121':15,'169':3,'289':3,'361':105,'529':21,
          }
          assert r['distinct_seeds'] == [3,15,21,105]
          expected={
              '3': (35740,29871,5869,900,900,{'+1':3148,'-1':2721},{'0':900,'1':2263,'2':2185,'3':458,'4':63},4),
              '15':(4525,3597,928,177,177,{'+1':480,'-1':448},{'0':177,'1':420,'2':303,'3':28},3),
              '21':(3553,3274,279,148,148,{'+1':203,'-1':76},{'0':148,'1':71,'2':55,'3':5},3),
              '105':(133,103,30,30,30,{'+1':30,'-1':0},{'0':30},0),
          }
          for seed,vals in expected.items():
              s=r['seed_reports'][seed]
              states,hits,misses,pure,puremiss,leg,hist,maxnr=vals
              assert s['states'] == states
              assert s['hit_states'] == hits
              assert s['miss_states'] == misses
              assert s['pure_qr_states'] == pure
              assert s['pure_qr_miss_states'] == puremiss
              assert s['legendre59_miss_branches'] == leg
              assert s['min_added_nonresidue_histogram'] == hist
              assert s['maximum_minimum_added_nonresidue_units'] == maxnr
          assert all(r['all_class_closures_subset_of_universal_forced3'].values())
          print(
              '::notice title=k=59 class atlas::'
              f"seeds={r['class_seed']}; "
              f"misses={{s:r['seed_reports'][s]['miss_states'] for s in r['seed_reports']}}"
          )
          PY

      - name: Independent finite realization regression
        run: |
          python3 research/erdos-straus/verify_k59_class_conditioned_states.py \
            --limit 100000 --json > /tmp/k59-class-regression.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/k59-class-regression.json', encoding='utf-8'))
          assert r['analysis'] == 'k59-class-conditioned-structural-regression-v1'
          assert r['hard_primes'] == 273
          assert r['outcomes_by_hard_class'] == {
              '1':{'hit':19,'miss':26},
              '121':{'hit':22,'miss':28},
              '169':{'hit':12,'miss':31},
              '289':{'hit':13,'miss':32},
              '361':{'hit':23,'miss':17},
              '529':{'hit':28,'miss':22},
          }
          assert r['realized_state_counts_by_hard_class'] == {
              '1':44,'121':49,'169':43,'289':45,'361':35,'529':50,
          }
          assert r['mismatches'] == 0
          print(
              '::notice title=k=59 class realization::'
              f"hard={r['hard_primes']}; outcomes={r['outcomes_by_hard_class']}"
          )
          PY
