name: Erdős–Straus trivial divisor selectors

on:
  pull_request:
    paths:
      - "research/erdos-straus/SIGNED-BOX-TRIVIAL-DIVISOR-SELECTORS.md"
      - "research/erdos-straus/verify_signed_box_trivial_divisor_selectors.py"
      - ".github/workflows/erdos-straus-trivial-divisor-selectors.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact trivial-divisor selector verification
        run: python3 research/erdos-straus/verify_signed_box_trivial_divisor_selectors.py --json
