name: Erdős–Straus k=55 two-target filter

on:
  pull_request:
    paths:
      - 'research/erdos-straus/K55-TWO-TARGET-FILTER.md'
      - 'research/erdos-straus/classify_k55_states.py'
      - 'research/erdos-straus/verify_k55_structure.py'
      - '.github/workflows/erdos-straus-k55-two-target.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fedora-k55-two-target:
    name: Fedora k=55 exact closure
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Install Fedora Python
        run: dnf -y install python3

      - uses: actions/checkout@v7

      - name: Verify exact k=55 closure
        run: |
          python3 research/erdos-straus/classify_k55_states.py --json > /tmp/k55.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/k55.json', encoding='utf-8'))
          assert r['analysis'] == 'k55-two-target-state-closure-v1'
          assert r['group'] == 'C20 x C2'
          assert r['type_i_residue'] == 41
          assert r['type_i_coordinate'] == [1,8]
          assert r['minus_one_coordinate'] == [1,10]
          assert r['states'] == 20082
          assert r['admissible_states'] == 9558
          assert r['hit_states'] == 7239
          assert r['miss_states'] == 2319
          assert r['pure_H_states'] == 710
          assert r['pure_H_miss_states'] == 211
          assert r['nonpure_miss_states'] == 2108
          assert r['miss_symmetry_orbits'] == 1436
          assert r['miss_symmetry_fixed'] == 553
          assert r['miss_symmetry_pairs'] == 883
          assert r['legendre11_miss_branches'] == {'+1':1381,'-1':938}
          assert r['min_outside_histogram'] == {'0':211,'2':1962,'4':146}
          assert r['maximum_minimum_outside_units'] == 4
          print(
              '::notice title=k=55 exact closure::'
              f"states={r['states']}; admissible={r['admissible_states']}; "
              f"misses={r['miss_states']}; outside={r['min_outside_histogram']}"
          )
          PY

      - name: Independent finite divisor-box regression
        run: |
          python3 research/erdos-straus/verify_k55_structure.py --limit 100000 --json > /tmp/k55-regression.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/k55-regression.json', encoding='utf-8'))
          assert r['analysis'] == 'k55-structural-regression-v1'
          assert r['hard_primes'] == 273
          assert r['direct_hits'] == 108
          assert r['direct_misses'] == 165
          assert r['mismatches'] == 0
          assert r['legendre11_outcomes'] == {
              '+1:hit':18,
              '+1:miss':107,
              '-1:hit':90,
              '-1:miss':58,
          }
          print(
              '::notice title=k=55 independent regression::'
              f"hard={r['hard_primes']}; hits={r['direct_hits']}; "
              f"misses={r['direct_misses']}; mismatches={r['mismatches']}"
          )
          PY
