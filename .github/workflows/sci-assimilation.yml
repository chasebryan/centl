name: CENTL-SCi assimilation report

on:
  workflow_dispatch:
  push:
    paths:
      - "lab/sci-assimilation/latest.json"
      - "lab/sci-assimilation/latest.md"

concurrency:
  group: sci-assimilation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    name: Validate and surface assimilation evidence
    runs-on: ubuntu-24.04

    steps:
      - name: Check out report history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate harness Python syntax
        run: |
          python3 -m py_compile \
            scripts/sci-assimilate.py \
            scripts/sci-assimilation-check.py

      - name: Validate report structure and provenance
        run: python3 scripts/sci-assimilation-check.py lab/sci-assimilation/latest.json

      - name: Surface report summary
        run: cat lab/sci-assimilation/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve assimilation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: centl-sci-assimilation-${{ github.sha }}
          path: |
            lab/sci-assimilation/latest.json
            lab/sci-assimilation/latest.md
          if-no-files-found: error

      - name: Determine whether this push publishes fresh evidence
        id: provenance
        shell: bash
        run: |
          source_commit=$(python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("lab/sci-assimilation/latest.json").read_text(encoding="utf-8"))
          print(report["git"]["commit"])
          PY
          )
          printf 'source_commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf 'enforce=true\n' >> "$GITHUB_OUTPUT"
            printf 'Manual dispatch: enforcing report product/safety gates.\n' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$source_commit" = "${{ github.event.before }}" ]; then
            printf 'enforce=true\n' >> "$GITHUB_OUTPUT"
            printf 'Fresh report publication detected for source commit `%s`.\n' "$source_commit" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'enforce=false\n' >> "$GITHUB_OUTPUT"
            printf 'Historical/stale report carried by this push; structural/provenance validation passed, but product/safety gates are not re-enforced. Report source: `%s`; push predecessor: `%s`.\n' \
              "$source_commit" "${{ github.event.before }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce product and safety gates
        if: steps.provenance.outputs.enforce == 'true'
        run: |
          python3 scripts/sci-assimilation-check.py \
            --require-source-ancestor \
            --require-product-gates \
            lab/sci-assimilation/latest.json
