name: Erdős–Straus k=35 two-target theorem

on:
  pull_request:
    paths:
      - 'research/erdos-straus/K35-TWO-TARGET-FILTER.md'
      - 'research/erdos-straus/K35-TWO-TARGET-STRUCTURE.md'
      - 'research/erdos-straus/classify_k35_states.py'
      - 'research/erdos-straus/verify_k35_structure.py'
      - '.github/workflows/erdos-straus-k35-two-target.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Independent hard-prime regression limit'
        required: false
        default: '10000000'

permissions:
  contents: read

jobs:
  fedora-k35:
    name: Fedora exact k=35 classification
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    env:
      LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '100000' }}

    steps:
      - name: Install Fedora Python
        run: dnf -y install python3

      - uses: actions/checkout@v7

      - name: Exhaust exact finite state space
        run: |
          python3 research/erdos-straus/classify_k35_states.py --json --table > /tmp/k35-state.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/k35-state.json', encoding='utf-8'))
          assert r['analysis'] == 'k35-two-target-state-closure-v1'
          assert r['states'] == 1298
          assert r['admissible_states'] == 650
          assert r['hit_states'] == 418
          assert r['miss_states'] == 232
          assert r['pure_H_states'] == 92
          assert r['pure_H_miss_states'] == 92
          assert r['nonpure_miss_states'] == 140
          assert r['miss_symmetry_orbits'] == 149
          assert r['miss_symmetry_fixed'] == 66
          assert r['miss_symmetry_pairs'] == 83
          assert r['min_outside_histogram'] == {'0': 92, '2': 138, '4': 2}
          assert len(r['miss_rows']) == 232
          assert len(r['exceptional_min_outside_4_states']) == 2
          assert all(x['targets_coincide'] for x in r['exceptional_min_outside_4_states'])
          print(
              '::notice title=Exact k=35 state closure::'
              f"states={r['states']}; admissible={r['admissible_states']}; "
              f"miss={r['miss_states']}; min-outside={r['min_outside_histogram']}"
          )
          PY

      - name: Independent direct-divisor regression
        run: |
          python3 research/erdos-straus/verify_k35_structure.py --limit "$LIMIT" --json > /tmp/k35-direct.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/k35-direct.json', encoding='utf-8'))
          assert r['analysis'] == 'k35-structural-regression-v1'
          assert r['hard_primes'] > 0
          assert r['mismatches'] == 0
          assert r['E2_cases_checked'] > 0
          print(
              '::notice title=Independent k=35 divisor regression::'
              f"limit={r['limit']}; hard={r['hard_primes']}; "
              f"E2={r['E2_cases_checked']}; mismatches={r['mismatches']}"
          )
          PY
