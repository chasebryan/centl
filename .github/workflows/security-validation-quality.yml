name: Security validation quality diagnostics

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-validation-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-diagnostic:
    name: Quality diagnostic — ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: formatting
            needs_ocaml: true
          - check: dune-checks
            needs_ocaml: true
          - check: opam-lint
            needs_ocaml: true
          - check: toolchain-pins
            needs_ocaml: false
          - check: licensing
            needs_ocaml: false
          - check: install-interface
            needs_ocaml: false
          - check: integrity
            needs_ocaml: false
          - check: supply-chain
            needs_ocaml: false

    steps:
      - name: Check out validation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OCaml build dependencies
        if: matrix.needs_ocaml
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates git make m4 pkg-config \
            libgmp-dev libmpfr-dev libflint-dev

      - name: Set up pinned OCaml
        if: matrix.needs_ocaml
        uses: ocaml/setup-ocaml@15d660006c1d3110d77c34b7faa3bddefe8b82f0 # v3.7.0
        with:
          ocaml-compiler: ocaml-base-compiler.4.14.1
          opam-pin: false

      - name: Install pinned CENTL dependencies
        if: matrix.needs_ocaml
        run: opam install . --deps-only --with-test --assume-depexts

      - name: Run exact quality component
        env:
          QUALITY_CHECK: ${{ matrix.check }}
        shell: bash
        run: |
          set -euo pipefail
          case "$QUALITY_CHECK" in
            formatting)
              opam exec -- dune build @fmt
              ;;
            dune-checks)
              opam exec -- dune build @check
              ;;
            opam-lint)
              opam lint centl.opam
              ;;
            toolchain-pins)
              scripts/check-toolchain-pins
              ;;
            licensing)
              sh scripts/check-licensing
              ;;
            install-interface)
              python3 scripts/install-interface-check.py
              ;;
            integrity)
              python3 scripts/integrity.py self-test
              mkdir -p _build/integrity
              python3 scripts/integrity.py source-manifest --output _build/integrity/SHA256SUMS
              python3 scripts/integrity.py hash _build/integrity/SHA256SUMS > _build/integrity/SHA256SUMS.sha256
              ;;
            supply-chain)
              python3 scripts/supply-chain-check.py
              ;;
            *)
              printf 'unknown quality diagnostic: %s\n' "$QUALITY_CHECK" >&2
              exit 2
              ;;
          esac
