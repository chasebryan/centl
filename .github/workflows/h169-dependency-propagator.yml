name: h169 dependency propagator

on:
  push:
    branches:
      - agent/h169-dependency-propagator
  pull_request:
    paths:
      - 'research/erdos-straus/H169-DEPENDENCY-PROPAGATOR.md'
      - 'research/erdos-straus/propagate_h169_dependency_state.py'
      - '.github/workflows/h169-dependency-propagator.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile propagator
        run: python3 -m py_compile research/erdos-straus/propagate_h169_dependency_state.py
      - name: Run exact self-test
        run: python3 research/erdos-straus/propagate_h169_dependency_state.py --self-test --json
      - name: Pin Route-B BARE propagation
        run: |
          python3 research/erdos-straus/propagate_h169_dependency_state.py \
            --route B --k19-mode BARE --json > /tmp/route-b-bare.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/route-b-bare.json'))
          assert r['contradiction'] is False
          assert r['domains']['tau19'] == [8]
          assert r['domains']['k27_mode'] == ['Q']
          PY
      - name: Pin exact contradiction exit
        run: |
          set +e
          python3 research/erdos-straus/propagate_h169_dependency_state.py \
            --route B --k19-mode BARE --k27-mode A --json > /tmp/contradiction.json
          code=$?
          set -e
          test "$code" -eq 1
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/contradiction.json'))
          assert r['contradiction'] is True
          assert r['surviving_formal_tuples'] == 0
          PY
