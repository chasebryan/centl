name: CENTL web

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "src-web/**"
      - "site/index.html"
      - "site/hub.html"
      - "site/style.css"
      - "caravan/observability.py"
      - "caravan/public_service.py"
      - "docs/CARAVAN-PUBLIC-COORDINATOR.md"
      - "scripts/x200-centl-web"
      - "scripts/fcf-centl-web-install"
      - "scripts/caravan-live-bazaar"
      - "scripts/x200-caravan-live-census"
      - "scripts/caravan-observability"
      - "tests/test_caravan_live_bazaar.py"
      - "tests/test_caravan_observability.py"
      - ".github/workflows/centl-web.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "src-web/**"
      - "site/index.html"
      - "site/hub.html"
      - "site/style.css"
      - "caravan/observability.py"
      - "caravan/public_service.py"
      - "docs/CARAVAN-PUBLIC-COORDINATOR.md"
      - "scripts/x200-centl-web"
      - "scripts/fcf-centl-web-install"
      - "scripts/caravan-live-bazaar"
      - "scripts/x200-caravan-live-census"
      - "scripts/caravan-observability"
      - "tests/test_caravan_live_bazaar.py"
      - "tests/test_caravan_observability.py"
      - ".github/workflows/centl-web.yml"

permissions:
  contents: read

jobs:
  rust-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Show Rust toolchain
        run: rustc --version && cargo --version
      - name: Test CENTL web
        run: cargo test --all-targets
      - name: Test X200 web deployment contract
        run: python3 src-web/tests/test_x200_centl_web.py
      - name: Test live CARAVAN Bazaar refresh
        run: python3 tests/test_caravan_live_bazaar.py
      - name: Test CARAVAN recruitment observability
        run: python3 tests/test_caravan_observability.py
      - name: Build CENTL web release
        run: cargo build --release --bin centl-web
