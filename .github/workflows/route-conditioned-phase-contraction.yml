name: route conditioned phase contraction

on:
  push:
    branches:
      - agent/route-conditioned-phase-contraction
  pull_request:
    paths:
      - 'research/erdos-straus/ROUTE-CONDITIONED-PHASE-CONTRACTION.md'
      - 'research/erdos-straus/verify_route_conditioned_phase_contraction.py'
      - '.github/workflows/route-conditioned-phase-contraction.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify route-conditioned phase contraction
        run: python3 research/erdos-straus/verify_route_conditioned_phase_contraction.py --json
