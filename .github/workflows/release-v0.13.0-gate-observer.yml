name: Observe CENTL v0.13.0 native gate

on:
  workflow_run:
    workflows:
      - Native releases
    types:
      - completed

permissions:
  contents: write

jobs:
  record-failure:
    name: Record exact-main native gate failure
    if: >-
      github.event.workflow_run.conclusion != 'success' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04

    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - name: Record failure only for current v0.13.0 main
        shell: bash
        run: |
          set -euo pipefail
          failed_sha='${{ github.event.workflow_run.head_sha }}'
          current_sha=$(git rev-parse HEAD)
          test "$failed_sha" = "$current_sha" || exit 0
          test "$(cat src/ocaml/centl_version.ml)" = 'let value = "0.13.0"' || exit 0

          branch='automation/v0.13.0-native-gate-failure'
          git switch -c "$branch"
          mkdir -p .release-gate
          cat > .release-gate/v0.13.0-failure.txt <<EOF
          conclusion=${{ github.event.workflow_run.conclusion }}
          run_id=${{ github.event.workflow_run.id }}
          head_sha=$failed_sha
          workflow_url=${{ github.event.workflow_run.html_url }}
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .release-gate/v0.13.0-failure.txt
          git commit -m 'Record v0.13.0 native gate failure'
          git push --force-with-lease origin HEAD:refs/heads/$branch
