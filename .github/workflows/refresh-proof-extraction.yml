name: Refresh proof extraction

on:
  push:
    branches:
      - verify/polynomial-soundness

concurrency:
  group: refresh-proof-extraction
  cancel-in-progress: true

permissions:
  contents: write

env:
  FSTAR_VERSION: "2026.07.05"
  FSTAR_COMMIT: "2173bc4316a51f01754f10bf94f697aba083c2e0"
  FSTAR_SHA256: "23829d496c909c67f7261c1471be34047ad0d508ee0b933607618b313cbae1a4"
  Z3_VERSION: "4.13.3"

jobs:
  refresh:
    name: Refresh checked F* extraction
    runs-on: ubuntu-24.04

    steps:
      - name: Check out proof branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: verify/polynomial-soundness
          persist-credentials: true

      - name: Install pinned F*
        run: |
          archive="$RUNNER_TEMP/fstar.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/FStarLang/FStar/releases/download/v${FSTAR_VERSION}/fstar-v${FSTAR_VERSION}-Linux-x86_64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$FSTAR_SHA256" "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/fstar"
          tar -xzf "$archive" -C "$RUNNER_TEMP/fstar"
          fstar=$(find "$RUNNER_TEMP/fstar" -type f -path '*/bin/fstar.exe' -print -quit)
          test -n "$fstar"
          "$fstar" --version | grep -F "commit=${FSTAR_COMMIT}"
          z3=$("$fstar" --locate_z3 "$Z3_VERSION")
          "$z3" --version | grep -F "Z3 version ${Z3_VERSION}"
          printf '%s\n' "$(dirname "$fstar")" >> "$GITHUB_PATH"

      - name: Regenerate and commit checked extraction
        run: |
          make extract
          git diff --exit-code -- src/generated/Centl_Gcd.ml
          if git diff --quiet -- src/generated/Centl_Core.ml; then
            echo "Centl_Core.ml is already current"
            exit 0
          fi
          git add src/generated/Centl_Core.ml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh checked F* Core extraction"
          git push origin HEAD:verify/polynomial-soundness
