name: Erdős–Straus exact-state incoming repulsion

on:
  pull_request:
    paths:
      - "research/erdos-straus/EXACT-STATE-INCOMING-REPULSION.md"
      - "research/erdos-straus/classify_exact_state_incoming_repulsion.py"
      - "research/erdos-straus/verify_exact_state_incoming_repulsion.py"
      - ".github/workflows/erdos-straus-exact-state-incoming-repulsion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact-state repulsion classifier
        run: python3 research/erdos-straus/classify_exact_state_incoming_repulsion.py --json
      - name: Independent exact-state verification
        if: hashFiles('research/erdos-straus/verify_exact_state_incoming_repulsion.py') != ''
        run: python3 research/erdos-straus/verify_exact_state_incoming_repulsion.py --json
