name: k51 phase absorption

on:
  pull_request:
    paths:
      - 'research/erdos-straus/K51-PHASE-ABSORPTION.md'
      - 'research/erdos-straus/verify_k51_phase_absorption.py'
      - '.github/workflows/k51-phase-absorption.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact h169 k51 phase theorem
        run: python3 research/erdos-straus/verify_k51_phase_absorption.py --json
