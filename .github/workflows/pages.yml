name: FCF Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/branding/fcf-centl-banner.png'
      - 'assets/branding/centl-sci-v0.0.1-camelus-banner.png'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tor client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tor

      - name: Start private Tor client
        run: |
          set -eu
          tor_data="$RUNNER_TEMP/fcf-caravan-tor"
          mkdir -m 700 "$tor_data"
          tor --RunAsDaemon 1 --SocksPort 19050 --DataDirectory "$tor_data" --ClientOnly 1 --Log "notice file $RUNNER_TEMP/fcf-caravan-tor.log"
          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail --max-time 2 --socks5-hostname 127.0.0.1:19050 --proxy "" --proto "=http" http://check.torproject.org/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Tor client did not become ready; publishing a Hungry result." >&2
            echo "CARAVAN_TOR_READY=0" >> "$GITHUB_ENV"
          else
            echo "CARAVAN_TOR_READY=1" >> "$GITHUB_ENV"
          fi

      - name: Probe X200
        run: |
          if [ "${CARAVAN_TOR_READY:-0}" = "1" ]; then
            python3 scripts/caravan-lead-census --origin-file site/pub/centl/caravan/lead-origin.json --output site/pub/centl/caravan/lead-census-v1.json --socks 127.0.0.1:19050
          else
            python3 scripts/caravan-lead-census --origin-file site/pub/centl/caravan/lead-origin.json --output site/pub/centl/caravan/lead-census-v1.json --stale
          fi

      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: First-time Pages enablement notice
        if: steps.pages.outcome != 'success'
        run: |
          echo '::notice::GitHub Pages is not enabled for this repository yet. In Settings -> Pages, select GitHub Actions as the source, then re-run FCF Pages.'

      - name: Assemble static site
        if: steps.pages.outcome == 'success'
        run: |
          set -eu
          rm -rf _site
          mkdir -p _site/assets
          cp -a site/. _site/
          python3 scripts/caravan-render-bazaar --template site/mirrors.html --census site/pub/centl/caravan/lead-census-v1.json --output _site/mirrors.html
          cp assets/branding/fcf-centl-banner.png _site/assets/fcf-centl-banner.png
          cp assets/branding/centl-sci-v0.0.1-camelus-banner.png _site/assets/centl-sci-v0.0.1-camelus-banner.png

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
