name: Oasis qualified-byte publication
run-name: Publish qualified CENTL Oasis release

on:
  push:
    branches:
      - main
    paths:
      - ".github/oasis-publication-trigger"

permissions:
  contents: read

concurrency:
  group: oasis-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact qualified Oasis bytes
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - name: Check out trusted publication control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve exact qualified candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(tr -d '[:space:]' < .github/oasis-publication-trigger)
          if ! printf '%s' "$candidate" | grep -Eq '^[0-9a-f]{40}$'; then
            printf 'publication candidate must be a full lowercase 40-hex SHA\n' >&2
            exit 1
          fi
          printf 'sha=%s\n' "$candidate" >> "$GITHUB_OUTPUT"

      - name: Mark exact-SHA publication pending
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          target="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload=$(printf '{"state":"pending","context":"centl/oasis-publication","description":"CENTL qualified-byte publication running","target_url":"%s"}' "$target")
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" \
            --data "$payload" >/dev/null

      - name: Publish already-qualified bytes
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/oasis-publication-runner.py \
            --repository "$GITHUB_REPOSITORY" \
            --candidate "$CANDIDATE_SHA"

      - name: Publish exact-SHA publication result
        if: always() && steps.candidate.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description='CENTL qualified-byte publication failed'
          if [ "$PUBLICATION_OUTCOME" = success ]; then
            state=success
            description='CENTL qualified bytes published and reverified'
          fi
          target="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload=$(printf '{"state":"%s","context":"centl/oasis-publication","description":"%s","target_url":"%s"}' \
            "$state" "$description" "$target")
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" \
            --data "$payload" >/dev/null
