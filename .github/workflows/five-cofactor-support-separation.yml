name: Five-cofactor support separation

on:
  pull_request:
    paths:
      - 'research/erdos-straus/FIVE-COFACTOR-SUPPORT-SEPARATION.md'
      - 'research/erdos-straus/verify_five_cofactor_support_separation.py'
      - '.github/workflows/five-cofactor-support-separation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact five-cofactor route separation
        run: python3 research/erdos-straus/verify_five_cofactor_support_separation.py --json
