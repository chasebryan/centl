name: Oasis promotion qualification

on:
  pull_request:
    branches:
      - oasis

permissions:
  contents: read

concurrency:
  group: oasis-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FSTAR_VERSION: "2026.07.05"
  FSTAR_COMMIT: "2173bc4316a51f01754f10bf94f697aba083c2e0"
  FSTAR_SHA256: "23829d496c909c67f7261c1471be34047ad0d508ee0b933607618b313cbae1a4"
  Z3_VERSION: "4.13.3"
  GMP_VERSION: "6.3.0"
  GMP_SHA256: "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898"
  MPFR_VERSION: "4.2.2"
  MPFR_SHA256: "b67ba0383ef7e8a8563734e2e889ef5ec3c3b898a01d00fa0a6869ad81c6ce01"
  FLINT_VERSION: "3.0.1"
  FLINT_SHA256: "7b311a00503a863881eb8177dbeb84322f29399f3d7d72f3b1a4c9ba1d5794b4"
  PORTABLE_X86_CFLAGS: "-O2 -fomit-frame-pointer -m64 -march=x86-64 -mtune=generic"
  CENTL_LINUX_GLIBC_BASELINE: "2.31"

jobs:
  self-test:
    name: Promotion engine self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out proposed Oasis candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compile Oasis policy surfaces
        run: |
          python3 -m py_compile \
            scripts/oasis.py \
            scripts/oasis_engine.py \
            scripts/oasis-toolchain-check.py \
            scripts/oasis-metadata-check.py \
            scripts/oasis_required_checks.py \
            scripts/oasis-security-state.py \
            scripts/check-linux-release-abi.py \
            tests/test_oasis.py \
            tests/test_oasis_metadata.py \
            tests/test_oasis_required_checks.py \
            tests/test_oasis_security_state.py \
            tests/test_linux_release_abi.py

      - name: Run adversarial Oasis policy tests
        run: python3 -m unittest discover -s tests -p 'test_oasis*.py'

      - name: Run Linux release portability tests
        run: python3 -m unittest discover -s tests -p 'test_linux_release_abi.py'

      - name: Validate complete candidate plan
        run: python3 scripts/oasis.py --root "$PWD" --no-repair --plan

  converge:
    name: Promotion full convergence
    needs: self-test
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04
    timeout-minutes: 90
    env:
      JULIA_NUM_THREADS: "1"
      JULIA_PKG_PRECOMPILE_AUTO: "0"
    steps:
      - name: Check out proposed Oasis candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configure runner paths
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'NATIVE_PREFIX=%s/centl-native\n' "$RUNNER_TEMP"
            printf 'PKG_CONFIG_PATH=%s/centl-native/lib/pkgconfig\n' "$RUNNER_TEMP"
            printf 'LIBRARY_PATH=%s/centl-native/lib\n' "$RUNNER_TEMP"
            printf 'LD_LIBRARY_PATH=%s/centl-native/lib\n' "$RUNNER_TEMP"
            printf 'C_INCLUDE_PATH=%s/centl-native/include\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Install build prerequisites
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            binutils build-essential ca-certificates curl git libzstd1 m4 make opam patch \
            pkg-config python3 python3-venv tar xz-utils

      - name: Bootstrap pinned proof and native toolchain
        run: sh scripts/oasis-ci-bootstrap

      - name: Set up pinned Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.12.6"

      - name: Instantiate pinned independent oracle
        run: julia --startup-file=no --project=lab/julia -e 'using Pkg; Pkg.instantiate()'

      - name: Create isolated CARAVAN Python environment
        run: python3 -m venv "$RUNNER_TEMP/oasis-venv"

      - name: Install pinned CARAVAN dependencies
        run: |
          "$RUNNER_TEMP/oasis-venv/bin/python" -m pip \
            --disable-pip-version-check install \
            --only-binary=:all: \
            -r caravan/requirements-phase1.txt

      - name: Execute complete candidate convergence
        env:
          OPAM_SWITCH: centl
        run: |
          "$RUNNER_TEMP/oasis-venv/bin/python" scripts/oasis.py \
            --root "$PWD" --no-repair --keep-going

      - name: Preserve promotion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oasis-promotion-evidence-${{ github.sha }}
          path: _build/oasis/**
          if-no-files-found: warn
