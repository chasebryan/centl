name: k27 phase intersection elimination

on:
  push:
    branches:
      - agent/k27-phase-intersection-elimination
  pull_request:
    paths:
      - 'research/erdos-straus/K27-PHASE-INTERSECTION-ELIMINATION.md'
      - 'research/erdos-straus/verify_k27_phase_intersection_elimination.py'
      - '.github/workflows/k27-phase-intersection-elimination.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile verifier
        run: python3 -m py_compile research/erdos-straus/verify_k27_phase_intersection_elimination.py
      - name: Verify exact phase intersections
        run: python3 research/erdos-straus/verify_k27_phase_intersection_elimination.py --json
