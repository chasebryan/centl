name: CENTL Erdős-Straus simplified fab billion

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Prime scan limit
        required: false
        default: "1000000000"
  push:
    branches: [research/es-reduced-parameter-domain]
    paths:
      - 'research/erdos-straus/fab_simplified_scan.cpp'
      - 'research/erdos-straus/verify_fab_simplified_scan.cpp'
      - 'research/erdos-straus/FAB-ONE-PARAMETER-AXES.md'
      - 'research/erdos-straus/FAB-COPRIME-PARITY-PLANE.md'
      - 'research/erdos-straus/FAB-ELEVEN-BARRIER.md'
      - '.github/workflows/erdos-straus-fab-simplified-billion.yml'

permissions:
  contents: read

jobs:
  simplified-fab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIMIT: ${{ github.event.inputs.limit || '1000000000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build independent scanners
        run: |
          g++ -O3 -std=c++17 research/erdos-straus/fab_simplified_scan.cpp -o /tmp/fab-primary
          g++ -O3 -std=c++17 research/erdos-straus/verify_fab_simplified_scan.cpp -o /tmp/fab-independent

      - name: Run simplified divisor-congruence scanner
        run: |
          mkdir -p fab-simplified-output
          /tmp/fab-primary "${LIMIT}" fab-simplified-output/fab-simplified-primary.json 11 \
            2> fab-simplified-output/primary-stderr.txt

      - name: Run independent original-fab scanner
        run: |
          /tmp/fab-independent "${LIMIT}" fab-simplified-output/fab-simplified-independent.json 11 \
            2> fab-simplified-output/independent-stderr.txt

      - name: Cross-check billion frontier
        if: env.LIMIT == '1000000000'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('fab-simplified-output')
          p=json.loads((root/'fab-simplified-primary.json').read_text())
          v=json.loads((root/'fab-simplified-independent.json').read_text())
          assert p['limit']==v['limit']==1_000_000_000
          assert p['hard_primes_checked']==v['hard_primes_checked']==1_587_581, (p,v)
          assert p['survivors']==v['survivors']==0, (p,v)
          assert p['verdict']==v['verdict']=='ZERO_SURVIVORS'
          crit={row['p'] for row in p['critical_bound_11_examples']}
          assert crit=={5_101_441,84_525_841}, crit
          hist={int(k):int(n) for k,n in p['minimal_parameter_bound_histogram'].items()}
          assert hist.get(11)==2, hist
          assert sum(hist.values())==1_587_581, hist
          PY

      - name: Write report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('fab-simplified-output')
          p=json.loads((root/'fab-simplified-primary.json').read_text())
          lines=[
              '# Simplified fab subsystem finite certificate',
              '',
              f'- prime bound: `{p["limit"]:,}`',
              f'- Mordell-hard primes checked: `{p["hard_primes_checked"]:,}`',
              f'- survivors with exact axes + coprime opposite-parity interior, `a,b<=11`: **`{p["survivors"]}`**',
              '',
              '## Minimal parameter bound histogram',
              '',
              '| max(a,b) | primes first covered |',
              '|---:|---:|',
          ]
          for c,n in sorted((int(k),int(v)) for k,v in p['minimal_parameter_bound_histogram'].items()):
              lines.append(f'| {c} | {n:,} |')
          lines += [
              '',
              '## Bound 11 is necessary in this finite range',
              '',
          ]
          for row in p['critical_bound_11_examples']:
              lines.append(f'- `p={row["p"]:,}`: `(a,b,k,q)=({row["a"]},{row["b"]},{row["k"]},{row["q"]})`')
          lines += [
              '',
              'The independent verifier evaluates the original published fab divisibility conditions rather than the simplified divisor-congruence theorem.',
              '',
              'Finite coverage is evidence and a theorem-certificate for the stated bound, not a universal proof.',
              '',
          ]
          (root/'fab-simplified-report.md').write_text('\n'.join(lines))
          PY

      - name: Freeze certificate
        run: |
          cat > fab-simplified-output/provenance.txt <<EOF
          workflow_run=${GITHUB_RUN_ID}
          workflow_sha=${GITHUB_SHA}
          repository=${GITHUB_REPOSITORY}
          limit=${LIMIT}
          EOF
          cd fab-simplified-output
          sha256sum fab-simplified-primary.json \
                    fab-simplified-independent.json \
                    fab-simplified-report.md \
                    provenance.txt > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish summary
        run: cat fab-simplified-output/fab-simplified-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: erdos-straus-fab-simplified-${{ github.sha }}
          path: fab-simplified-output/
          if-no-files-found: error
          retention-days: 90
