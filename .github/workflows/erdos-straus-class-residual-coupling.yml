name: Erdős–Straus class residual coupling

on:
  push:
    branches:
      - agent/cbx-class-residual-coupling
  pull_request:
    paths:
      - 'research/erdos-straus/MORDELL-HARD-CLASS-RESIDUAL-COUPLING.md'
      - 'research/erdos-straus/verify_class_residual_coupling.py'
      - '.github/workflows/erdos-straus-class-residual-coupling.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact class residual identities
        run: |
          python3 research/erdos-straus/verify_class_residual_coupling.py --max-r 100000 --json
