name: Temporary PR39 reviewed-fix applier

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/claim-verification-foundation'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/claim-verification-foundation
          persist-credentials: true
          fetch-depth: 1

      - name: Apply reviewed parser fixes and regressions
        shell: python
        run: |
          from pathlib import Path

          main = Path("src/ocaml/main.ml")
          source = main.read_text()
          filter_line = '      |> List.filter (( <> ) "")\n'
          if source.count(filter_line) < 1:
              raise SystemExit("empty-field filter line not found")
          source = source.replace(filter_line, "", 1)

          parser_join = "    in\n    begin match parts with\n"
          parser_guard = (
              "    in\n"
              "    if List.exists (( = ) \"\") parts then\n"
              "      failwith\n"
              "        (\"line \" ^ string_of_int line_number\n"
              "       ^ \": contract fields must not be empty\")\n"
              "    else\n"
              "      begin match parts with\n"
          )
          if parser_join not in source:
              raise SystemExit("parser join not found")
          source = source.replace(parser_join, parser_guard, 1)

          reader_head = "      let rec loop line_number total_bytes acc =\n"
          if reader_head not in source:
              raise SystemExit("reader loop head not found")
          source = source.replace(
              reader_head, "      let rec loop line_number acc =\n", 1
          )
          byte_block = (
              "            let total_bytes = total_bytes + String.length line + 1 in\n"
              "            if total_bytes > max_bytes then\n"
              "              failwith\n"
              "                (Printf.sprintf \"contract exceeds the %d-byte source limit\"\n"
              "                   max_bytes);\n"
          )
          if byte_block not in source:
              raise SystemExit("synthetic byte-count block not found")
          source = source.replace(byte_block, "", 1)
          source = source.replace(
              "            loop (line_number + 1) total_bytes acc\n",
              "            loop (line_number + 1) acc\n",
              1,
          )
          source = source.replace("      loop 1 0 [])\n", "      loop 1 [])\n", 1)
          main.write_text(source)

          cli = Path("tests/cli.t")
          tests = cli.read_text().rstrip()
          regressions = (
              "\n\n  $ printf '%s\\n' '| equal | 1 | 1' > empty-field-contract.centl\n"
              "  $ ../src/main.exe check empty-field-contract.centl; echo $?\n"
              "  centl: line 1: contract fields must not be empty\n"
              "  2\n\n"
              "  $ python3 -c 'from pathlib import Path; p=Path(\"exact-limit-contract.centl\"); prefix=b\"equal | 1 | 1\\n#\"; p.write_bytes(prefix + b\"x\" * (32768 - len(prefix))); print(p.stat().st_size)'\n"
              "  32768\n"
              "  $ ../src/main.exe check exact-limit-contract.centl; echo $?\n"
              "  line 1: verified\n"
              "  0\n"
          )
          cli.write_text(tests + regressions)

      - name: Commit reviewed fixes
        run: |
          git config user.name "CENTL validation automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/ocaml/main.ml tests/cli.t
          git diff --cached --check
          git commit -m "Fix contract parser review edge cases"
          git push origin HEAD:codex/claim-verification-foundation
