name: Temporary PR39 patch export

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply reviewed contract parser fixes
        shell: python
        run: |
          from pathlib import Path

          main = Path("src/ocaml/main.ml")
          source = main.read_text()

          filter_line = '      |> List.filter (( <> ) "")\n'
          if source.count(filter_line) < 1:
              raise SystemExit("empty-field filter line not found")
          source = source.replace(filter_line, "", 1)

          parser_join = "    in\n    begin match parts with\n"
          parser_guard = (
              "    in\n"
              "    if List.exists (( = ) \"\") parts then\n"
              "      failwith\n"
              "        (\"line \" ^ string_of_int line_number\n"
              "       ^ \": contract fields must not be empty\")\n"
              "    else\n"
              "      begin match parts with\n"
          )
          if parser_join not in source:
              raise SystemExit("parser join not found")
          source = source.replace(parser_join, parser_guard, 1)

          source = source.replace(
              "      let rec loop line_number total_bytes acc =\n",
              "      let rec loop line_number acc =\n",
              1,
          )
          byte_block = (
              "            let total_bytes = total_bytes + String.length line + 1 in\n"
              "            if total_bytes > max_bytes then\n"
              "              failwith\n"
              "                (Printf.sprintf \"contract exceeds the %d-byte source limit\"\n"
              "                   max_bytes);\n"
          )
          if byte_block not in source:
              raise SystemExit("synthetic byte-count block not found")
          source = source.replace(byte_block, "", 1)
          source = source.replace(
              "            loop (line_number + 1) total_bytes acc\n",
              "            loop (line_number + 1) acc\n",
              1,
          )
          source = source.replace("      loop 1 0 [])\n", "      loop 1 [])\n", 1)
          main.write_text(source)

          cli = Path("tests/cli.t")
          tests = cli.read_text()
          anchor = (
              "  $ printf '%s\\\\n' 'define | x = 1' > definition-only-contract.centl\n"
              "  $ ../src/main.exe check definition-only-contract.centl; echo $?\n"
              "  centl: no assertions in definition-only-contract.centl\n"
              "  2\n\n"
          )
          addition = (
              anchor
              + "  $ printf '%s\\\\n' '| equal | 1 | 1' > empty-field-contract.centl\n"
              + "  $ ../src/main.exe check empty-field-contract.centl; echo $?\n"
              + "  centl: line 1: contract fields must not be empty\n"
              + "  2\n\n"
              + "  $ python3 -c 'from pathlib import Path; p=Path(\"exact-limit-contract.centl\"); prefix=b\"equal | 1 | 1\\\\n#\"; p.write_bytes(prefix + b\"x\" * (32768 - len(prefix))); print(p.stat().st_size)'\n"
              + "  32768\n"
              + "  $ ../src/main.exe check exact-limit-contract.centl; echo $?\n"
              + "  line 1: verified\n"
              + "  0\n\n"
          )
          if anchor not in tests:
              raise SystemExit("cli test insertion anchor not found")
          cli.write_text(tests.replace(anchor, addition, 1))

      - name: Export patched files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr39-contract-parser-fix
          path: |
            src/ocaml/main.ml
            tests/cli.t
          if-no-files-found: error
          retention-days: 1
