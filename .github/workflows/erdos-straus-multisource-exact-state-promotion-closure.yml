name: Erdős–Straus multi-source exact-state promotion closure

on:
  pull_request:
    paths:
      - "research/erdos-straus/MULTISOURCE-EXACT-STATE-PROMOTION-CLOSURE.md"
      - "research/erdos-straus/classify_multisource_exact_state_promotion_closure.py"
      - "research/erdos-straus/verify_multisource_exact_state_promotion_closure.py"
      - ".github/workflows/erdos-straus-multisource-exact-state-promotion-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-close graph with two-source exact-state promotion
        run: python3 research/erdos-straus/classify_multisource_exact_state_promotion_closure.py --max-k 5000 --json
      - name: Independent closure verification
        if: hashFiles('research/erdos-straus/verify_multisource_exact_state_promotion_closure.py') != ''
        run: python3 research/erdos-straus/verify_multisource_exact_state_promotion_closure.py --json
