name: Oasis canonical formatting

on:
  push:
    branches:
      - chore/final-oasis-mirage-validation

permissions:
  contents: write

concurrency:
  group: oasis-canonical-formatting
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out validation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/final-oasis-mirage-validation

      - name: Install formatter toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git make m4 opam pkg-config libgmp-dev libmpfr-dev libflint-dev
          opam init --bare --disable-sandboxing --yes
          opam switch create centl ocaml-base-compiler.4.14.1 --jobs=2 --yes
          opam install --switch=centl --deps-only --with-test --assume-depexts --yes .

      - name: Apply repository formatter
        run: opam exec --switch=centl -- make format-fix

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet --; then
            echo "Formatting already canonical."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style: apply canonical OCaml formatting"
          git push origin HEAD:chore/final-oasis-mirage-validation
