name: Erdős–Straus k=23 two-target theorem

on:
  pull_request:
    paths:
      - 'research/erdos-straus/K23-TWO-TARGET-FILTER.md'
      - 'research/erdos-straus/ES-BINARY-LANE-I-EQUIVALENCE.md'
      - 'research/erdos-straus/STRONG-ES-Q23-EXACT-FILTER.md'
      - 'research/erdos-straus/verify_k23_two_target.py'
      - '.github/workflows/erdos-straus-k23-two-target.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Inclusive prime upper bound for the independent regression'
        required: true
        default: '10000000'

permissions:
  contents: read

jobs:
  fedora-k23:
    name: Fedora exact k=23 regression
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    env:
      LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '100000' }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Install Fedora Python
        run: dnf -y install python3

      - uses: actions/checkout@v4

      - name: Run independent k=23 theorem verifier
        run: |
          mkdir -p /tmp/k23
          python3 research/erdos-straus/verify_k23_two_target.py \
            --limit "$LIMIT" --json > /tmp/k23/report.json
          cat /tmp/k23/report.json

      - name: Enforce exact theorem invariants
        run: |
          python3 - <<'PY'
          import json, os
          r = json.load(open('/tmp/k23/report.json', encoding='utf-8'))
          assert r['analysis'] == 'k23-two-target-regression-v1'
          assert r['hard_primes'] > 0
          assert r['actual_hits'] + r['actual_misses'] == r['hard_primes']
          assert r['classification_mismatches'] == 0
          assert r['type_i_divisor_equivalence_mismatches'] == 0
          assert r['type_ii_misses'] >= r['actual_misses']
          print(
              f"::notice title=Exact k=23 two-target theorem::"
              f"limit={r['limit']}; hard={r['hard_primes']}; "
              f"hits={r['actual_hits']}; misses={r['actual_misses']}; "
              f"Type-I rescues={r['type_i_rescues_of_type_ii']}; "
              f"branches={r['branch_counts']}"
          )
          PY

      - name: Preserve provenance
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "source_commit=$SOURCE_SHA"
            echo "limit=$LIMIT"
            echo "os_release=$(tr '\n' ' ' </etc/os-release)"
            echo "python=$(python3 --version)"
          } > /tmp/k23/ENVIRONMENT.txt
          cd /tmp/k23
          sha256sum report.json ENVIRONMENT.txt > SHA256SUMS

      - name: Upload full research replay
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: es-k23-two-target-X${{ env.LIMIT }}-${{ env.SOURCE_SHA }}
          path: /tmp/k23/
          if-no-files-found: error
          retention-days: 90
