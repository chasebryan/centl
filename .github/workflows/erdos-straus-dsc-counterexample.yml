name: CENTL Erdős-Straus DSC counterexample

on:
  workflow_dispatch:
  push:
    branches: [research/es-reduced-parameter-domain]
    paths:
      - 'research/erdos-straus/dsc_counterexample_probe.cpp'
      - 'research/erdos-straus/verify_dsc_counterexample.py'
      - '.github/workflows/erdos-straus-dsc-counterexample.yml'

permissions:
  contents: read

jobs:
  verify-counterexample:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build primary exhaustive verifier
        run: g++ -O3 -std=c++17 research/erdos-straus/dsc_counterexample_probe.cpp -o /tmp/dsc-counterexample

      - name: Run primary exhaustive verifier
        run: |
          mkdir -p dsc-counterexample-output
          /tmp/dsc-counterexample dsc-counterexample-output/dsc-counterexample-primary.json \
            | tee dsc-counterexample-output/primary-stdout.txt

      - name: Run independent reconstruction
        run: |
          python3 research/erdos-straus/verify_dsc_counterexample.py \
            --out dsc-counterexample-output \
            | tee dsc-counterexample-output/independent-stdout.txt

      - name: Cross-check exact verdicts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('dsc-counterexample-output')
          p=json.loads((root/'dsc-counterexample-primary.json').read_text())
          v=json.loads((root/'dsc-counterexample-independent-verifier.json').read_text())
          for obj in (p,v):
              assert obj['k']==4478950, obj
              assert obj['m']==17915799, obj
              assert obj['h']==1 and obj['t']==17892349, obj
              assert obj['r']==1236166681 and obj['L']==5016423720, obj
              assert obj['q3_union_mask']==7, obj
              assert obj['direct_shadow_sources']==0, obj
              assert obj['verdict']=='DIRECTLY_NOVEL_UNION_SHADOW', obj
          assert p['earlier_layers']==v['earlier_layers']==4478949
          PY

      - name: Write report and freeze certificate
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('dsc-counterexample-output')
          p=json.loads((root/'dsc-counterexample-primary.json').read_text())
          v=json.loads((root/'dsc-counterexample-independent-verifier.json').read_text())
          report=f'''# Direct-Shadow Completeness counterexample certificate

- target: `k={p["k"]}`, `m={p["m"]}`
- hard class: `h={p["h"]}`
- target trap: `t={p["t"]}`
- progression: `r={p["r"]}`, `L={p["L"]}`
- q=3 union mask: `{p["q3_union_mask"]}` = `{{0,1,2}}`
- earlier layers checked: `{p["earlier_layers"]}`
- primary exact direct-shadow candidates tested: `{p["exact_direct_candidates_tested"]}`
- primary direct-shadow sources: **`{p["direct_shadow_sources"]}`**
- independent exact trap-size survivors: `{v["exact_trap_size_survivors"]}`
- independent direct-shadow sources: **`{v["direct_shadow_sources"]}`**

Verdict: **DIRECTLY NOVEL UNION SHADOW**.

This is a counterexample to Direct-Shadow Completeness / DSC-0. It does not disprove López Type A/B coverage or Erdős-Straus.
'''
          (root/'dsc-counterexample-report.md').write_text(report)
          PY
          cat > dsc-counterexample-output/provenance.txt <<EOF
          workflow_run=${GITHUB_RUN_ID}
          workflow_sha=${GITHUB_SHA}
          repository=${GITHUB_REPOSITORY}
          EOF
          cd dsc-counterexample-output
          sha256sum dsc-counterexample-primary.json \
                    dsc-counterexample-independent-verifier.json \
                    dsc-counterexample-report.md \
                    provenance.txt > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish summary
        run: cat dsc-counterexample-output/dsc-counterexample-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: erdos-straus-dsc-counterexample-${{ github.sha }}
          path: dsc-counterexample-output/
          if-no-files-found: error
          retention-days: 90
