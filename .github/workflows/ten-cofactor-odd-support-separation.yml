name: ten-cofactor odd support separation

on:
  push:
    branches:
      - agent/ten-cofactor-odd-support-separation
  pull_request:
    paths:
      - 'research/erdos-straus/TEN-COFACTOR-ODD-SUPPORT-SEPARATION.md'
      - 'research/erdos-straus/verify_ten_cofactor_odd_support_separation.py'
      - '.github/workflows/ten-cofactor-odd-support-separation.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify ten-cofactor odd-support separation
        run: python3 research/erdos-straus/verify_ten_cofactor_odd_support_separation.py --json
