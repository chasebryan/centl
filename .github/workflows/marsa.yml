name: CENTL Marsa harbor

on:
  push:
    branches:
      - CENTL-Marsa
  pull_request:
    branches:
      - CENTL-Marsa
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marsa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-probe:
    name: Linux probe stays honest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe, flags, and installer contract
        run: |
          set -eu
          sh scripts/marsa-probe
          python3 tests/test_marsa_install.py

  macos-product:
    name: macOS Camp product
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Homebrew numeric stack
        run: |
          set -eu
          brew install gmp mpfr flint pkg-config
          sh scripts/marsa-probe
      - uses: ocaml/setup-ocaml@c1574629b7cc38ef189d7228c2794fb5f9042478 # v3.7.1
        with:
          ocaml-compiler: ocaml-base-compiler.4.14.1
          opam-pin: false
      - name: Build and smoke the three commands
        run: |
          set -eu
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          opam install --yes dune.3.24.1 zarith.1.14 yojson.2.2.2 conf-gmp conf-mpfr conf-flint
          eval "$(opam env)"
          make marsa-smoke

  windows-libraries:
    name: Windows MSYS2 FLINT harbor
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@fb197b72ce45fb24f17bf3f807a388985654d1f2 # v2.29.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-mpfr
            mingw-w64-x86_64-flint
      - name: Link a FLINT probe
        run: |
          set -eu
          sh scripts/marsa-probe
          gcc -Wall -Wextra \
            scripts/marsa-native-probe.c \
            $(pkg-config --cflags --libs flint gmp mpfr) \
            -o /tmp/centl-marsa-probe
          /tmp/centl-marsa-probe

  windows-product:
    name: Windows Camp product
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@fb197b72ce45fb24f17bf3f807a388985654d1f2 # v2.29.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-mpfr
            mingw-w64-x86_64-flint
            mingw-w64-x86_64-make
            unzip
            patch
            diffutils
            tar
      - uses: ocaml/setup-ocaml@c1574629b7cc38ef189d7228c2794fb5f9042478 # v3.7.1
        with:
          ocaml-compiler: ocaml-base-compiler.4.14.1
          windows-compiler: mingw
          windows-environment: msys2
          opam-pin: false
      - name: Build and smoke the three commands
        shell: msys2 {0}
        run: |
          set -eu
          opam install --yes dune.3.24.1 zarith.1.14 yojson.2.2.2 conf-gmp conf-mpfr conf-flint
          eval "$(opam env)"
          make marsa-smoke
