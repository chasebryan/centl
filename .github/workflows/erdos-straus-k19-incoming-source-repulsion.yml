name: Erdős–Straus h289 k19 incoming source repulsion

on:
  pull_request:
    paths:
      - "research/erdos-straus/K19-INCOMING-SOURCE-REPULSION.md"
      - "research/erdos-straus/classify_k19_incoming_source_repulsion.py"
      - "research/erdos-straus/verify_k19_incoming_source_repulsion.py"
      - ".github/workflows/erdos-straus-k19-incoming-source-repulsion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact h289 k19 repulsion classifier
        run: python3 research/erdos-straus/classify_k19_incoming_source_repulsion.py --json
      - name: Independent quotient-group and anchor verification
        run: python3 research/erdos-straus/verify_k19_incoming_source_repulsion.py --json
