name: Erdős–Straus recursive character promotion

on:
  pull_request:
    paths:
      - "research/erdos-straus/RECURSIVE-CHARACTER-PROMOTION.md"
      - "research/erdos-straus/classify_recursive_character_promotion.py"
      - "research/erdos-straus/classify_recursive_k23_repulsion.py"
      - "research/erdos-straus/verify_recursive_character_promotion.py"
      - ".github/workflows/erdos-straus-recursive-character-promotion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact recursive closure classifier
        run: python3 research/erdos-straus/classify_recursive_character_promotion.py --max-k 5000 --max-sources 2 --json
      - name: Recursive k23 repulsion classifier
        run: python3 research/erdos-straus/classify_recursive_k23_repulsion.py --max-k 5000 --max-sources 2 --json
      - name: Independent ancestry-aware regression
        run: python3 research/erdos-straus/verify_recursive_character_promotion.py --json
