name: Route-B k47 phase feedback

on:
  push:
    branches:
      - agent/route-b-k47-phase-feedback-clean
  pull_request:
    paths:
      - 'research/erdos-straus/ROUTE-B-K47-PHASE-FEEDBACK.md'
      - 'research/erdos-straus/verify_route_b_k47_phase_feedback.py'
      - '.github/workflows/route-b-k47-phase-feedback.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile verifier
        run: python3 -m py_compile research/erdos-straus/verify_route_b_k47_phase_feedback.py
      - name: Verify exact Route-B k47 feedback
        run: python3 research/erdos-straus/verify_route_b_k47_phase_feedback.py --json
