name: Erdős–Straus k=47 forced-6 reduction

on:
  pull_request:
    paths:
      - 'research/erdos-straus/K47-FORCED6-HARD-REDUCTION.md'
      - 'research/erdos-straus/K47-ONE-PACKET-COMPANION-FILTER.md'
      - 'research/erdos-straus/K47-NEGATIVE-LEGENDRE-CORRIDOR-10M.md'
      - 'research/erdos-straus/analyze_k47_negative_corridor.py'
      - 'research/erdos-straus/classify_k47_forced6_states.py'
      - 'research/erdos-straus/classify_k47_states.py'
      - '.github/workflows/erdos-straus-k47-forced6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fedora-k47-forced6:
    name: Fedora k=47 forced-6 closure
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Install Fedora Python
        run: dnf -y install python3

      - uses: actions/checkout@v7

      - name: Verify hard-prime forced-6 closure
        run: |
          python3 research/erdos-straus/classify_k47_forced6_states.py --json --table > /tmp/k47-forced6.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/k47-forced6.json', encoding='utf-8'))
          assert r['analysis'] == 'k47-forced6-hard-state-closure-v1'
          assert r['forced_factors'] == [2,3]
          assert r['forced_logs'] == [18,20]
          assert r['forced_start_divisor_set_size'] == 9
          assert r['forced_start_center_log'] == 38
          assert r['states'] == 1079
          assert r['hit_states'] == 883
          assert r['miss_states'] == 196
          assert r['pure_qr_states'] == 66
          assert r['pure_qr_miss_states'] == 66
          assert r['legendre47_miss_branches'] == {'+1':116,'-1':80}
          assert r['min_added_nonresidue_histogram'] == {'0':66,'1':80,'2':50}
          assert r['maximum_minimum_added_nonresidue_units'] == 2
          assert len(r['miss_rows']) == 196
          print(
              '::notice title=k=47 forced-6 hard closure::'
              f"states={r['states']}; misses={r['miss_states']}; "
              f"Legendre={r['legendre47_miss_branches']}; "
              f"added-NR={r['min_added_nonresidue_histogram']}"
          )
          PY

      - name: Verify exact one-packet miss partition
        working-directory: research/erdos-straus
        run: |
          python3 - <<'PY'
          import analyze_k47_negative_corridor as a
          classes = a.one_packet_miss_classes()
          expected = {
              1: 7, 7: 2, 9: 13, 11: 3, 17: 6, 19: 10,
              27: 11, 29: 3, 35: 3, 37: 13, 45: 9,
          }
          actual = {r: len(states) for r, states in classes.items()}
          assert actual == expected, actual
          union = set().union(*classes.values())
          assert len(union) == 80
          assert sum(map(len, classes.values())) == 80
          memberships = {
              state: sum(state in states for states in classes.values())
              for state in union
          }
          assert set(memberships.values()) == {1}
          residues = {
              pow(a.k47.PRIMITIVE_ROOT, r, a.k47.MOD)
              for r in classes
          }
          assert residues == {5,10,11,13,19,20,26,29,33,38,40}
          print(
              '::notice title=k=47 one-packet partition::'
              f"classes={len(classes)}; states={len(union)}; sizes={actual}"
          )
          PY

      - name: Verify complete-universe direct census smoke test
        working-directory: research/erdos-straus
        run: |
          python3 analyze_k47_negative_corridor.py --direct --hi 1000000 --json > /tmp/k47-direct-1m.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/k47-direct-1m.json', encoding='utf-8'))
          assert r['analysis'] == 'k47-negative-legendre-corridor-v3-complete-universe'
          assert r['complete_universe'] is True
          assert r['hard_universe'] == 2370
          assert r['negative_legendre_k47_misses'] == 118
          assert r['residual_after_prior_corridor'] == 0
          assert r['uncovered_targets'] == []
          print(
              '::notice title=k=47 complete census smoke::'
              f"hard={r['hard_universe']}; negative-misses={r['negative_legendre_k47_misses']}"
          )
          PY

      - name: Preserve the 50M cross-shift counterexample signature
        working-directory: research/erdos-straus
        run: |
          python3 - <<'PY'
          import analyze_k47_negative_corridor as a
          p=25569769
          assert p % 840 == 169
          assert a.legendre47_negative(p)
          for k in (3,7,11,15,19,23,27,31,35,39,43,47,51):
              assert not a.signed_box_hit(p,k), (p,k)
          assert a.signed_box_hit(p,55)
          state=a.actual_k47_state(p)
          assert state == (8065427790955,3)
          assert hex(state[0]) == '0x755e0f55c6b'
          dirs=[r for r,states in a.one_packet_miss_classes().items() if state in states]
          assert dirs == [11]
          print(
              '::notice title=k=47 corridor counterexample::'
              'p=25569769 misses k<=51 corridor sample and first tested hit is k=55'
          )
          PY
