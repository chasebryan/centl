name: Erdős–Straus k=47 forced-6 reduction

on:
  pull_request:
    paths:
      - 'research/erdos-straus/K47-FORCED6-HARD-REDUCTION.md'
      - 'research/erdos-straus/K47-ONE-PACKET-COMPANION-FILTER.md'
      - 'research/erdos-straus/classify_k47_forced6_states.py'
      - 'research/erdos-straus/classify_k47_states.py'
      - '.github/workflows/erdos-straus-k47-forced6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fedora-k47-forced6:
    name: Fedora k=47 forced-6 closure
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Install Fedora Python
        run: dnf -y install python3

      - uses: actions/checkout@v4

      - name: Verify hard-prime forced-6 closure
        run: |
          python3 research/erdos-straus/classify_k47_forced6_states.py --json --table > /tmp/k47-forced6.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/k47-forced6.json', encoding='utf-8'))
          assert r['analysis'] == 'k47-forced6-hard-state-closure-v1'
          assert r['forced_factors'] == [2,3]
          assert r['forced_logs'] == [18,20]
          assert r['forced_start_divisor_set_size'] == 9
          assert r['forced_start_center_log'] == 38
          assert r['states'] == 1079
          assert r['hit_states'] == 883
          assert r['miss_states'] == 196
          assert r['pure_qr_states'] == 66
          assert r['pure_qr_miss_states'] == 66
          assert r['legendre47_miss_branches'] == {'+1':116,'-1':80}
          assert r['min_added_nonresidue_histogram'] == {'0':66,'1':80,'2':50}
          assert r['maximum_minimum_added_nonresidue_units'] == 2
          assert len(r['miss_rows']) == 196
          print(
              '::notice title=k=47 forced-6 hard closure::'
              f"states={r['states']}; misses={r['miss_states']}; "
              f"Legendre={r['legendre47_miss_branches']}; "
              f"added-NR={r['min_added_nonresidue_histogram']}"
          )
          PY
