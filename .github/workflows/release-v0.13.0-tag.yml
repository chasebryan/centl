name: Tag CENTL v0.13.0 after native gate

on:
  workflow_run:
    workflows:
      - Native releases
    types:
      - completed

permissions:
  contents: write

jobs:
  tag:
    name: Create v0.13.0 tag
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out validated main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: true

      - name: Require exact v0.13.0 release state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
          test "$(cat src/ocaml/centl_version.ml)" = 'let value = "0.13.0"'

      - name: Create release tag once
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.13.0 >/dev/null 2>&1; then
            echo 'v0.13.0 already exists; nothing to do.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v0.13.0 -m 'CENTL v0.13.0'
          git push origin refs/tags/v0.13.0
