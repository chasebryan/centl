name: Align CENTL v0.13.0 release goldens

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.13.0-golden-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  align:
    name: Align current-version golden output
    runs-on: ubuntu-24.04

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - name: Update v0.13.0 CLI goldens and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat src/ocaml/centl_version.ml)" = 'let value = "0.13.0"'
          grep -q '0\.12\.0' tests/cli.t
          sed -i 's/0\.12\.0/0.13.0/g' tests/cli.t
          ! grep -q '0\.12\.0' tests/cli.t
          grep -q '0\.13\.0' tests/cli.t
          git rm .github/workflows/release-v0.13.0-golden-fix.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/cli.t
          git commit -m 'Align v0.13.0 CLI golden outputs'
          git push origin HEAD:main

      - name: Start native gate on corrected main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run release.yml --ref main
