name: Erdős–Straus k31 survivor normal form

on:
  pull_request:
    paths:
      - "research/erdos-straus/K31-SURVIVOR-NORMAL-FORM.md"
      - "research/erdos-straus/verify_k31_survivor_normal_form.py"
      - ".github/workflows/erdos-straus-k31-survivor-normal-form.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact k31 survivor-state verification
        run: python3 research/erdos-straus/verify_k31_survivor_normal_form.py --json
