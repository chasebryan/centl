name: Fast validation

on:
  pull_request:

permissions:
  contents: write

env:
  OPAMYES: "1"

jobs:
  format-parser:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/claim-verification-foundation'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/claim-verification-foundation
          persist-credentials: true
          fetch-depth: 1

      - name: Set up pinned OCaml
        uses: ocaml/setup-ocaml@15d660006c1d3110d77c34b7faa3bddefe8b82f0 # v3
        with:
          ocaml-compiler: ocaml-base-compiler.4.14.1
          opam-pin: false

      - name: Install formatter
        run: opam install ocamlformat.0.29.0 dune.3.24.1

      - name: Apply repository formatter
        run: opam exec -- dune fmt src/ocaml/main.ml

      - name: Commit formatter output only
        run: |
          git config user.name "CENTL validation automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/ocaml/main.ml
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m "Format contract parser review fixes"
          git push origin HEAD:codex/claim-verification-foundation
