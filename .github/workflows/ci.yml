name: Fast validation

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FSTAR_VERSION: "2026.07.05"
  FSTAR_COMMIT: "2173bc4316a51f01754f10bf94f697aba083c2e0"
  FSTAR_SHA256: "23829d496c909c67f7261c1471be34047ad0d508ee0b933607618b313cbae1a4"
  Z3_VERSION: "4.13.3"
  OPAMYES: "1"
  JULIA_NUM_THREADS: "1"
  JULIA_PKG_PRECOMPILE_AUTO: "0"

jobs:
  validate:
    name: Verify, test, and compare with Nemo
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ca-certificates curl libflint-dev libgmp-dev libmpfr-dev \
            libzstd1 make pkg-config tar

      - name: Install pinned F*
        run: |
          archive="$RUNNER_TEMP/fstar.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/FStarLang/FStar/releases/download/v${FSTAR_VERSION}/fstar-v${FSTAR_VERSION}-Linux-x86_64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$FSTAR_SHA256" "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/fstar"
          tar -xzf "$archive" -C "$RUNNER_TEMP/fstar"
          fstar=$(find "$RUNNER_TEMP/fstar" -type f -path '*/bin/fstar.exe' -print -quit)
          test -n "$fstar"
          "$fstar" --version | grep -F "commit=${FSTAR_COMMIT}"
          z3=$("$fstar" --locate_z3 "$Z3_VERSION")
          "$z3" --version | grep -F "Z3 version ${Z3_VERSION}"
          printf '%s\n' "$(dirname "$fstar")" >> "$GITHUB_PATH"

      - name: Set up pinned OCaml
        uses: ocaml/setup-ocaml@15d660006c1d3110d77c34b7faa3bddefe8b82f0 # v3
        with:
          ocaml-compiler: ocaml-base-compiler.4.14.1
          opam-pin: false

      - name: Install pinned OCaml dependencies
        run: opam install . --deps-only --with-test --assume-depexts

      - name: Verify, extract, check, and test
        run: |
          make extract
          git ls-files --error-unmatch \
            src/generated/Centl_Gcd.ml src/generated/Centl_Core.ml \
            src/generated/Centl_PolynomialSoundness.ml
          git diff --exit-code -- src/generated
          opam exec -- make quality native-test native-build
          test "$(./_build/default/src/main.exe --build-info | sed -n 's/^commit=//p')" = "$GITHUB_SHA"

      - name: Run CENTL-SCi deterministic product assimilation
        run: |
          python3 -m py_compile \
            scripts/sci-assimilate.py \
            scripts/sci-assimilation-check.py
          python3 scripts/sci-assimilate.py \
            --skip-native \
            --fast-repeats 2 \
            --output-json "$RUNNER_TEMP/sci-assimilation.json" \
            --output-markdown "$RUNNER_TEMP/sci-assimilation.md"
          python3 scripts/sci-assimilation-check.py \
            --require-product-gates \
            "$RUNNER_TEMP/sci-assimilation.json"
          cat "$RUNNER_TEMP/sci-assimilation.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Exercise deterministic fuzzing, sanitizers, and performance budgets
        env:
          CENTL_SANITIZER_REQUIRED: "1"
        run: opam exec -- make hardening-test

      - name: Set up pinned Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.12.6"

      - name: Instantiate pinned Nemo environment
        run: julia --startup-file=no --project=lab/julia -e 'using Pkg; Pkg.instantiate()'

      - name: Run deterministic Julia/Nemo differential suite
        env:
          CENTL_BIN: ${{ github.workspace }}/_build/default/src/main.exe
        run: julia --startup-file=no --project=lab/julia lab/julia/differential.jl
