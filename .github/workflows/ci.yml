name: Fast validation

on:
  pull_request:

permissions:
  contents: write

env:
  OPAMYES: "1"

jobs:
  format-physics:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'physics/foundation'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out physics branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: physics/foundation
          persist-credentials: true
          fetch-depth: 1

      - name: Set up pinned OCaml
        uses: ocaml/setup-ocaml@15d660006c1d3110d77c34b7faa3bddefe8b82f0 # v3
        with:
          ocaml-compiler: ocaml-base-compiler.4.14.1
          opam-pin: false

      - name: Install formatter
        run: opam install ocamlformat.0.29.0 dune.3.24.1

      - name: Apply repository formatter
        run: |
          set +e
          opam exec -- dune fmt
          status=$?
          set -e
          if [ "$status" -ne 0 ] && git diff --quiet -- src/dune tests/dune tests/test_physics.ml; then
            exit "$status"
          fi

      - name: Commit physics formatter output only
        run: |
          git config user.name "CENTL validation automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/dune tests/dune tests/test_physics.ml
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m "Format physics foundation files"
          git push origin HEAD:physics/foundation
