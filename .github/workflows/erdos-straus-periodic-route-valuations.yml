name: Erdős–Straus periodic route valuations

on:
  pull_request:
    paths:
      - "research/erdos-straus/PERIODIC-ROUTE-VALUATION-LADDER.md"
      - "research/erdos-straus/verify_periodic_route_valuation_ladder.py"
      - ".github/workflows/erdos-straus-periodic-route-valuations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Exact periodic valuation regression
        run: python3 research/erdos-straus/verify_periodic_route_valuation_ladder.py --max-q 97 --max-level 3 --json
