name: Oasis exact-SHA target qualification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact CENTL release candidate commit SHA to qualify
        required: true
        type: string
  pull_request_target:
    branches:
      - oasis
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: oasis-target-${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.event.pull_request.head.sha }}
  FSTAR_VERSION: "2026.07.05"
  FSTAR_COMMIT: "2173bc4316a51f01754f10bf94f697aba083c2e0"
  FSTAR_SHA256: "23829d496c909c67f7261c1471be34047ad0d508ee0b933607618b313cbae1a4"
  Z3_VERSION: "4.13.3"
  GMP_VERSION: "6.3.0"
  GMP_SHA256: "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898"
  MPFR_VERSION: "4.2.2"
  MPFR_SHA256: "b67ba0383ef7e8a8563734e2e889ef5ec3c3b898a01d00fa0a6869ad81c6ce01"
  FLINT_VERSION: "3.0.1"
  FLINT_SHA256: "7b311a00503a863881eb8177dbeb84322f29399f3d7d72f3b1a4c9ba1d5794b4"
  PORTABLE_X86_CFLAGS: "-O2 -fomit-frame-pointer -m64 -march=x86-64 -mtune=generic"

jobs:
  start:
    name: Establish trusted Oasis candidate identity
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Validate candidate SHA shape
        shell: bash
        run: |
          set -euo pipefail
          case "$HEAD_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) printf 'candidate_sha must be a full lowercase 40-hex commit SHA\n' >&2; exit 1 ;;
          esac
      - name: Require candidate commit exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" >/dev/null
      - name: Mark exact-SHA qualification pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload=$(printf '{"state":"pending","context":"centl/oasis-target-qualification","description":"Exact-SHA Oasis qualification running","target_url":"%s"}' "$target")
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            --data "$payload" >/dev/null

  caravan:
    name: Identity, integrity, catalog, policy, and outbound transport gates
    needs: start
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - name: Require checkout identity
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Create isolated Python environment
        run: python3 -m venv "$RUNNER_TEMP/caravan-venv"
      - name: Install pinned Phase 1 dependencies
        run: |
          "$RUNNER_TEMP/caravan-venv/bin/python" -m pip \
            --disable-pip-version-check install \
            --only-binary=:all: \
            -r caravan/requirements-phase1.txt
      - name: Run CARAVAN Phase 1 checks
        env:
          PYTHON: ${{ runner.temp }}/caravan-venv/bin/python
        run: sh scripts/caravan-phase1-check

  self-test:
    name: Candidate adversarial engine self-test
    needs: start
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - name: Require checkout identity
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Compile Oasis policy surfaces
        run: |
          python3 -m py_compile \
            scripts/oasis.py \
            scripts/oasis_engine.py \
            scripts/oasis-toolchain-check.py \
            scripts/oasis-metadata-check.py \
            scripts/oasis_required_checks.py \
            scripts/oasis-security-state.py \
            tests/test_oasis.py \
            tests/test_oasis_metadata.py \
            tests/test_oasis_required_checks.py \
            tests/test_oasis_security_state.py
      - name: Run adversarial Oasis policy tests
        run: python3 -m unittest discover -s tests -p 'test_oasis*.py'
      - name: Validate complete candidate plan
        run: python3 scripts/oasis.py --root "$PWD" --no-repair --plan

  converge:
    name: Candidate full stable-product convergence
    needs:
      - start
      - caravan
      - self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      NATIVE_PREFIX: ${{ runner.temp }}/centl-native
      PKG_CONFIG_PATH: ${{ runner.temp }}/centl-native/lib/pkgconfig
      LIBRARY_PATH: ${{ runner.temp }}/centl-native/lib
      LD_LIBRARY_PATH: ${{ runner.temp }}/centl-native/lib
      C_INCLUDE_PATH: ${{ runner.temp }}/centl-native/include
      JULIA_NUM_THREADS: "1"
      JULIA_PKG_PRECOMPILE_AUTO: "0"
      CENTL_BUILD_COMMIT: ${{ env.HEAD_SHA }}
    steps:
      - name: Check out exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - name: Require checkout identity
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl git libzstd1 m4 make opam patch \
            pkg-config python3 python3-venv tar xz-utils
      - name: Bootstrap pinned proof and native toolchain
        run: sh scripts/oasis-ci-bootstrap
      - name: Set up pinned Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.12.6"
      - name: Instantiate pinned independent oracle
        run: julia --startup-file=no --project=lab/julia -e 'using Pkg; Pkg.instantiate()'
      - name: Create isolated Oasis Python environment
        run: python3 -m venv "$RUNNER_TEMP/oasis-venv"
      - name: Install pinned CARAVAN dependencies
        run: |
          "$RUNNER_TEMP/oasis-venv/bin/python" -m pip \
            --disable-pip-version-check install \
            --only-binary=:all: \
            -r caravan/requirements-phase1.txt
      - name: Execute complete exact-SHA Oasis convergence
        env:
          OPAM_SWITCH: centl
        run: |
          "$RUNNER_TEMP/oasis-venv/bin/python" scripts/oasis.py \
            --root "$PWD" --no-repair --keep-going
      - name: Preserve exact qualified release bytes
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oasis-release-${{ env.HEAD_SHA }}
          path: dist/*
          if-no-files-found: error
      - name: Preserve Oasis convergence evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oasis-evidence-${{ env.HEAD_SHA }}
          path: _build/oasis/**
          if-no-files-found: warn

  security:
    name: Candidate release security state
    needs: converge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Check out exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - name: Require checkout identity
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Require clear release-blocking GitHub security state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/oasis-security-state.py --root "$PWD"

  attest:
    name: Attest exact-SHA Oasis results
    if: always() && needs.start.result == 'success'
    needs:
      - start
      - caravan
      - self-test
      - converge
      - security
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      contents: read
      statuses: write
    env:
      SELF_RESULT: ${{ needs.self-test.result }}
      CONVERGE_RESULT: ${{ needs.converge.result }}
      SECURITY_RESULT: ${{ needs.security.result }}
    steps:
      - name: Publish exact-SHA check attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          post_check() {
            name=$1
            result=$2
            if [ "$result" = success ]; then conclusion=success; else conclusion=failure; fi
            payload=$(python3 - "$name" "$HEAD_SHA" "$conclusion" "$target" <<'PY'
          import json, sys
          name, sha, conclusion, target = sys.argv[1:]
          print(json.dumps({
              "name": name,
              "head_sha": sha,
              "status": "completed",
              "conclusion": conclusion,
              "details_url": target,
              "output": {
                  "title": name,
                  "summary": f"Exact-SHA Oasis qualification result: {conclusion}",
              },
          }))
          PY
          )
            curl --fail --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/check-runs" \
              --data "$payload" >/dev/null
          }
          post_check "Adversarial engine self-test" "$SELF_RESULT"
          post_check "Full stable-product convergence" "$CONVERGE_RESULT"
          post_check "Release security state" "$SECURITY_RESULT"

          if [ "$SELF_RESULT" = success ] && [ "$CONVERGE_RESULT" = success ] && [ "$SECURITY_RESULT" = success ]; then
            state=success
            description="Exact-SHA Oasis qualification passed"
          else
            state=failure
            description="Exact-SHA Oasis qualification failed"
          fi
          payload=$(printf '{"state":"%s","context":"centl/oasis-target-qualification","description":"%s","target_url":"%s"}' "$state" "$description" "$target")
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            --data "$payload" >/dev/null

          test "$SELF_RESULT" = success
          test "$CONVERGE_RESULT" = success
          test "$SECURITY_RESULT" = success
