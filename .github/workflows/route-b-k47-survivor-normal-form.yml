name: Route-B k47 survivor normal form

on:
  pull_request:
    paths:
      - 'research/erdos-straus/ROUTE-B-K47-SURVIVOR-NORMAL-FORM.md'
      - 'research/erdos-straus/verify_route_b_k47_survivor_normal_form.py'
      - '.github/workflows/route-b-k47-survivor-normal-form.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify exact Route-B k47 normal form
        run: python3 research/erdos-straus/verify_route_b_k47_survivor_normal_form.py --json
