name: Publish CENTL 0.10.0

on: # zizmor: ignore[dangerous-triggers] fixed release; successful push-to-main runs only, and no event-controlled content is executed
  workflow_run:
    workflows:
      - Native releases
    types:
      - completed

concurrency:
  group: publish-centl-0.10.0
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Publish corrected native release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_TAG: v0.10.0
      RELEASE_VERSION: 0.10.0
      STALE_TAG_SHA: df890759fadfdf2d653ee7b1ca677b48dcfdd8da

    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require an explicit release request
        id: request
        run: |
          message=$(git log -1 --format=%B)
          if printf '%s\n' "$message" | grep -Fq '[release v0.10.0]'; then
            printf 'requested=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'requested=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Download validated native artifacts
        if: steps.request.outputs.requested == 'true'
        run: |
          mkdir -p dist
          gh run download "$RELEASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "centl-${RELEASE_VERSION}-native-releases" \
            --dir dist

      - name: Validate complete release set
        if: steps.request.outputs.requested == 'true'
        run: |
          for asset in \
            centl-linux-x86_64.tar.gz \
            centl-macos-x86_64.tar.gz \
            centl-macos-arm64.tar.gz \
            centl-windows-x86_64.zip; do
            test -s "dist/$asset"
            test -s "dist/$asset.sha256"
            (cd dist && sha256sum --check "$asset.sha256")
          done
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 8

      - name: Publish CENTL 0.10.0
        if: steps.request.outputs.requested == 'true'
        run: |
          current_tag=$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" \
              --jq '.sha' 2>/dev/null || true
          )

          release_exists=false
          asset_count=0
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=true
            asset_count=$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets | length')
          fi

          if [ "$current_tag" = "$RELEASE_SHA" ] && \
             [ "$release_exists" = true ] && \
             [ "$asset_count" -eq 8 ]; then
            printf '%s already points to %s with the complete asset set.\n' \
              "$RELEASE_TAG" "$RELEASE_SHA"
            exit 0
          fi

          if [ -n "$current_tag" ] && [ "$current_tag" != "$RELEASE_SHA" ]; then
            test "$current_tag" = "$STALE_TAG_SHA"
          fi

          if [ "$release_exists" = true ]; then
            test "$current_tag" = "$STALE_TAG_SHA"
            gh release delete "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            current_tag=""
          elif [ -n "$current_tag" ] && [ "$current_tag" != "$RELEASE_SHA" ]; then
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG"
            current_tag=""
          fi

          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --generate-notes \
            --title "CENTL $RELEASE_VERSION"

          published_tag=$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '.object.sha'
          )
          published_assets=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets | length')
          test "$published_tag" = "$RELEASE_SHA"
          test "$published_assets" -eq 8
