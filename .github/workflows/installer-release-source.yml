name: Installer release-source independence

on:
  pull_request:
    branches:
      - oasis
    paths:
      - "install"
      - "scripts/install-interface-check.py"
      - "docs/INSTALL.md"
      - ".github/workflows/installer-release-source.yml"
  push:
    branches:
      - oasis
    paths:
      - "install"
      - "scripts/install-interface-check.py"
      - "docs/INSTALL.md"
      - ".github/workflows/installer-release-source.yml"

permissions:
  contents: read

jobs:
  linux:
    name: Test GNU/Linux static release root
    runs-on: ubuntu-24.04
    steps:
      - name: Check out CENTL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise installer
        run: python3 scripts/install-interface-check.py
