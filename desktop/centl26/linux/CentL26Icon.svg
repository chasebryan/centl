<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">CentL26 application icon</title>
  <desc id="description">A Google-grade modern mathematical instrument icon with harmonious layered geometry and vibrant scientific blues.</desc>
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Primary Dynamic Ribbon (Top Left to Bottom Right) -->
    <linearGradient id="ribbonBlue" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="50%" stop-color="#1A73E8"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>

    <!-- Vibrant Cyan Scientific Accent Ribbon -->
    <linearGradient id="ribbonCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="60%" stop-color="#24C1E0"/>
      <stop offset="100%" stop-color="#4285F4"/>
    </linearGradient>

    <!-- Deep Analytical Indigo Shadow Ribbon -->
    <linearGradient id="ribbonIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <!-- Elevation Ambient Shadow Filter -->
    <filter id="appShadow" x="-20%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#0F172A" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1E3A8A" flood-opacity="0.08"/>
    </filter>

    <!-- Inner Core Symbol Shadow -->
    <filter id="coreShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>

    <clipPath id="squircleClip">
      <rect x="64" y="64" width="896" height="896" rx="224"/>
    </clipPath>
  </defs>

  <!-- Base Icon Squircle Canvas -->
  <g filter="url(#appShadow)">
    <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bgGradient)" stroke="#E2E8F0" stroke-width="4"/>
  </g>

  <!-- Subtle Harmonic Substrate Coordinate Lattice -->
  <g clip-path="url(#squircleClip)" opacity="0.45" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="64" y1="288" x2="960" y2="288"/>
    <line x1="64" y1="512" x2="960" y2="512"/>
    <line x1="64" y1="736" x2="960" y2="736"/>
    <line x1="288" y1="64" x2="288" y2="960"/>
    <line x1="512" y1="64" x2="512" y2="960"/>
    <line x1="736" y1="64" x2="736" y2="960"/>
  </g>

  <!-- Central Emblem: Fluid Infinity Core & Exact Computation Geometry -->
  <g filter="url(#coreShadow)">
    <!-- Primary Continuous Precision Loop (Back Layer) -->
    <path d="M 330 310 C 210 310 180 470 270 570 L 490 730 C 530 760 590 760 630 730 L 750 630 C 850 540 830 380 710 340 C 620 310 540 370 490 430 L 430 500 C 390 550 330 550 300 510 C 270 470 280 410 330 390 L 450 340"
          fill="none" stroke="url(#ribbonIndigo)" stroke-width="84" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>

    <!-- Dynamic Cyan Continuous Loop (Front Geometric Core) -->
    <path d="M 680 710 C 800 710 830 550 740 450 L 520 290 C 480 260 420 260 380 290 L 260 390 C 160 480 180 640 300 680 C 390 710 470 650 520 590 L 580 520 C 620 470 680 470 710 510 C 740 550 730 610 680 630 L 560 680"
          fill="none" stroke="url(#ribbonBlue)" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Overlapping Radiant Cyan Highlight Arc -->
    <path d="M 380 290 L 260 390 C 160 480 180 640 300 680 C 390 710 470 650 520 590 L 580 520"
          fill="none" stroke="url(#ribbonCyan)" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Central Precision Focus Point (Golden Anchor) -->
    <circle cx="512" cy="512" r="32" fill="#FFFFFF" filter="url(#coreShadow)"/>
    <circle cx="512" cy="512" r="18" fill="#1A73E8"/>
  </g>

  <!-- Modern Corner Accent Sparks (Google-grade vitality) -->
  <circle cx="754" cy="270" r="16" fill="#00D4FF" opacity="0.9"/>
  <circle cx="796" cy="312" r="9" fill="#4285F4" opacity="0.75"/>
  <circle cx="270" cy="754" r="14" fill="#2563EB" opacity="0.85"/>
</svg>
