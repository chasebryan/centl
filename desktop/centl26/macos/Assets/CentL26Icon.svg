<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">CentL26 application icon</title>
  <desc id="description">A precise cobalt C26 instrument mark on a white scientific grid.</desc>
  <defs>
    <linearGradient id="field" x1="128" y1="96" x2="896" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="mark" x1="276" y1="248" x2="748" y2="776" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <clipPath id="shell">
      <rect x="64" y="64" width="896" height="896" rx="216"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#field)" stroke="#dbeafe" stroke-width="8"/>
  </g>

  <g clip-path="url(#shell)" opacity="0.72" stroke="#dbeafe" stroke-width="3">
    <path d="M64 256H960M64 448H960M64 640H960M64 832H960"/>
    <path d="M256 64V960M448 64V960M640 64V960M832 64V960"/>
  </g>

  <rect x="230" y="230" width="564" height="564" rx="148" fill="url(#mark)"/>
  <path d="M326 330H698" stroke="#93c5fd" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <circle cx="350" cy="330" r="11" fill="#ffffff"/>
  <circle cx="386" cy="330" r="11" fill="#bfdbfe"/>
  <circle cx="422" cy="330" r="11" fill="#60a5fa"/>

  <text x="512" y="590" fill="#ffffff" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="190" font-weight="750" letter-spacing="-20" text-anchor="middle">C26</text>
  <path d="M350 668H674" stroke="#bfdbfe" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
  <circle cx="674" cy="668" r="13" fill="#6ee7b7"/>
</svg>
