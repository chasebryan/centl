# FCF-Telepathy loopback publication boundary.
#
# TLS is terminated by the selected Telepathy transport on this same host.
# This listener is intentionally reachable only through loopback and serves only
# the already-activated CARAVAN generation. It is not a proxy and has no access
# to the preservation mirror, approved store, candidate tree, or user files.

server {
    listen 127.0.0.1:8787;
    server_name _;

    root /srv/fcf-caravan-live/current;
    index index.html;
    autoindex off;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/fcf-telepathy-error.log warn;

    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 20s;
    send_timeout 120s;
    reset_timedout_connection on;
    max_ranges 1;
    etag on;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = / {
        try_files /index.html =404;
    }
    location = /index.html {
        try_files $uri =404;
    }
    location = /robots.txt {
        try_files $uri =404;
    }
    location = /status.json {
        default_type application/json;
        try_files $uri =404;
    }
    location = /SHA256SUMS {
        default_type text/plain;
        try_files $uri =404;
    }
    location = /source/INDEX.json {
        default_type application/json;
        try_files $uri =404;
    }
    location = /source/centl-main.tar.gz {
        default_type application/gzip;
        try_files $uri =404;
    }
    location = /source/centl-oasis.tar.gz {
        default_type application/gzip;
        try_files $uri =404;
    }
    location = /source/centl-mirage.tar.gz {
        default_type application/gzip;
        try_files $uri =404;
    }
    location = /caravan/catalog-v1.json {
        default_type application/json;
        try_files $uri =404;
    }
    location = /caravan/CATALOG-STATUS {
        default_type text/plain;
        try_files $uri =404;
    }
    location = /caravan/INGEST-STATUS.json {
        default_type application/json;
        try_files $uri =404;
    }

    location ^~ /releases/ {
        default_type application/octet-stream;
        try_files $uri =404;
    }
    location ^~ /semantic/ {
        default_type application/octet-stream;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
