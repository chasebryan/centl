<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Desert Gold Radiant Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <linearGradient id="goldMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="haloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Golden Aura Filter -->
    <filter id="goldAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Ambient Desert Gold Aura Circle -->
  <circle cx="400" cy="300" r="260" fill="url(#haloGrad)"/>

  <g filter="url(#dropShadow)">
    <!-- BACK/CHEST CONTOUR OF THE NOBLE CAMEL -->
    <!-- Powerful Arching Neck Base & Shoulder -->
    <path d="M 180,520 C 220,440 260,370 290,290 C 310,240 330,190 360,130 C 375,100 395,75 425,65 C 455,55 485,65 510,85 C 530,100 545,120 575,125 C 605,130 645,115 675,135 C 700,150 710,180 695,210 C 685,230 655,245 635,255 C 610,265 580,265 560,285 C 535,310 525,350 515,390 C 500,450 470,500 420,535 C 380,560 310,565 240,545 Z" 
          fill="url(#goldDark)" stroke="#d97706" stroke-width="2"/>

    <!-- MUSCULAR MID-NECK & CHEST PLANES (FACETED ARABIAN CAMEL ANATOMY) -->
    <!-- Major Neck Arch Flange -->
    <path d="M 240,535 C 280,455 315,380 340,300 C 365,220 390,150 430,95 C 445,75 470,70 490,85 C 505,95 515,115 540,125 C 570,135 605,125 630,140 C 650,155 655,175 640,195 C 625,215 595,225 575,235 C 545,250 525,280 510,320 C 490,375 465,445 420,495 C 375,540 300,545 240,535 Z" 
          fill="url(#goldMid)"/>

    <!-- Light Reflective Neck Ridge (Upper Plane) -->
    <path d="M 285,505 C 320,435 350,360 375,285 C 400,210 420,155 450,110 C 465,90 485,90 500,105 C 520,125 545,135 570,145 C 600,155 625,150 635,170 C 640,180 635,195 615,205 C 585,220 560,240 545,275 C 525,325 500,400 460,455 C 420,505 350,515 285,505 Z" 
          fill="url(#goldLight)"/>

    <!-- REGAL CAMEL HEAD SCULPTURE -->
    <!-- Crown & Forehead -->
    <path d="M 430,95 C 445,70 475,60 505,70 C 530,80 550,100 580,110 C 610,120 645,110 670,125 C 690,135 700,155 695,175 C 690,195 670,210 645,215 C 615,220 585,215 565,230 C 540,250 530,285 520,320 C 495,270 470,200 445,150 Z" 
          fill="url(#goldLight)"/>

    <!-- Camel Nostril, Muzzle & Aristocratic Lip -->
    <path d="M 645,125 C 675,135 705,150 715,170 C 720,180 715,195 700,205 C 680,218 650,225 625,225 C 595,225 570,215 555,200 C 545,190 550,175 565,165 C 590,150 615,135 645,125 Z" 
          fill="url(#goldMid)"/>
    
    <path d="M 660,140 C 685,150 705,160 708,172 C 710,180 700,190 685,195 C 665,202 640,205 620,202 C 600,198 580,190 575,180 C 570,170 580,160 600,152 C 620,144 640,138 660,140 Z" 
          fill="url(#goldLight)"/>

    <!-- Nostril Slit -->
    <path d="M 675,170 C 685,168 692,172 690,178 C 688,182 680,184 672,182 Z" fill="#451a03"/>

    <!-- Intelligent, Noble Camel Eye -->
    <g transform="translate(545, 125)">
      <!-- Eye Socket Shadow -->
      <polygon points="0,15 25,5 40,20 20,30" fill="#78350f"/>
      <!-- Glowing Gold Sclera -->
      <polygon points="5,15 22,8 35,18 18,24" fill="#fef08a" filter="url(#goldAura)"/>
      <!-- Pupil -->
      <polygon points="12,14 26,10 24,18 10,18" fill="#1c1917"/>
      <!-- Brow Highlight -->
      <path d="M -5,10 C 15, -2 35, 2 50, 14" fill="none" stroke="#fffbeb" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Proud Camel Ear -->
    <path d="M 465,85 C 475,45 500,30 515,45 C 520,60 505,80 485,90 Z" fill="url(#goldLight)" stroke="#ca8a04" stroke-width="3"/>
    <path d="M 478,78 C 485,55 498,45 506,55 C 508,65 498,78 488,84 Z" fill="url(#goldDark)"/>

    <!-- DESERT MANE / THROAT TUFT (FLOWING GEOMETRIC FEATHERS) -->
    <g fill="url(#goldMid)" stroke="#f59e0b" stroke-width="2">
      <polygon points="340,320 310,380 370,360"/>
      <polygon points="360,370 325,440 395,410"/>
      <polygon points="385,420 345,500 420,460"/>
      <polygon points="410,470 380,545 445,505"/>
      <polygon points="305,270 270,320 330,305"/>
    </g>

    <!-- Flowing Mane Highlights -->
    <g fill="url(#goldLight)">
      <polygon points="350,335 325,380 365,365"/>
      <polygon points="370,385 340,440 388,415"/>
      <polygon points="395,435 365,495 412,465"/>
    </g>

    <!-- GOLDEN INFINITY ACCENT FLOURISH (EMBEDDED GEOMETRICALLY BENEATH THE CHEST) -->
    <path d="M 220,530 C 150,530 100,480 100,410 C 100,340 160,290 230,290 C 310,290 380,360 450,430 C 520,500 590,540 670,540 C 750,540 810,480 810,410 C 810,340 740,290 660,290 C 600,290 550,330 500,380" 
          fill="none" stroke="url(#goldRim)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>
</svg>
