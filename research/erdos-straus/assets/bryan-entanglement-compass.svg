<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Bryan Entanglement Compass</title>
  <desc id="desc">Eight-direction entanglement compass derived from the Bryan Entanglement Cross. Cardinal directions carry the Cross signs; diagonals carry three-stage composite sign schemes.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="1000" height="1000" fill="#fff"/>

  <g stroke="#000" stroke-width="24" stroke-linecap="square" fill="none" marker-end="url(#arrow)">
    <line x1="500" y1="430" x2="500" y2="125"/>
    <line x1="500" y1="570" x2="500" y2="875"/>
    <line x1="430" y1="500" x2="125" y2="500"/>
    <line x1="570" y1="500" x2="875" y2="500"/>
    <line x1="448" y1="448" x2="205" y2="205"/>
    <line x1="552" y1="448" x2="795" y2="205"/>
    <line x1="448" y1="552" x2="205" y2="795"/>
    <line x1="552" y1="552" x2="795" y2="795"/>
  </g>

  <rect x="430" y="430" width="140" height="140" fill="#fff" stroke="#000" stroke-width="8"/>
  <text x="500" y="532" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="112" fill="#000">ε</text>

  <g font-family="Arial, Helvetica, sans-serif" fill="#000" text-anchor="middle">
    <text x="500" y="74" font-size="58">⊕ / ⊖</text>
    <text x="500" y="960" font-size="58">⊖ / ⊕</text>
    <text x="68" y="520" font-size="72">⊖</text>
    <text x="932" y="520" font-size="72">⊕</text>

    <text x="160" y="145" font-size="48">+ / − / −</text>
    <text x="840" y="145" font-size="48">+ / + / −</text>
    <text x="160" y="900" font-size="48">− / − / +</text>
    <text x="840" y="900" font-size="48">− / + / +</text>
  </g>
</svg>
