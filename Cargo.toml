[package]
name = "centl-web"
version = "26.4.0"
edition = "2021"
authors = ["Free Computation Foundation <contact@freecomputation.org>"]
description = "CentL26 standalone scientific work environment and CENTL compatibility hosts"

[dependencies]
serde_json = "1.0.151"

[[bin]]
name = "centl-web"
path = "src-web/main.rs"

[[bin]]
name = "centl-hub"
path = "src-web/main.rs"

[[bin]]
name = "centl-lab"
path = "src-web/main.rs"

[[bin]]
name = "centl26"
path = "src-web/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
