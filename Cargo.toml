[package]
name = "centl-web"
version = "0.15.0"
edition = "2021"
authors = ["Free Computation Foundation <contact@freecomputation.org>"]
description = "Zero-JavaScript Web Application, Calculation Hub, and Erdős–Straus Engine for CENTL"

[[bin]]
name = "centl-web"
path = "src-web/main.rs"

[[bin]]
name = "centl-hub"
path = "src-web/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
